function distSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, l=dx*dx+dy*dy;
  let u=l?((px-ax)*dx+(py-ay)*dy)/l:0; u=Math.max(0,Math.min(1,u));
  return Math.hypot(px-ax-u*dx, py-ay-u*dy);
}
function nearPts(pts,x,y,m){ for(let i=0;i<pts.length-1;i++) if(distSeg(x,y,...pts[i],...pts[i+1])<m) return true; return false; }

}

      for(let q=0;q<3;q++){ spawn('harpy'); const m=enemies[enemies.length-1]; m.x=e.x+(Math.random()-.5)*30; m.y=e.y+(Math.random()-.5)*20; m.wp=e.wp; m.prog=e.prog; }
      effects.push({k:'ring', x:e.x, y:e.y, r:60, life:.5, max:.5, c:'190,120,255'});
    }
  }
  if(e.burn>0){ e.burn-=dt; hurt(e,e.burnDps*dt,true); }
  if(e.regen && !e.dead) e.hp=Math.min(e.max, e.hp+e.max*e.regen*dt);
  let d=sp*dt;
  while(d>0 && e.wp<PATH.length){
    const [tx,ty]=PATH[e.wp], dx=tx-e.x, dy=ty-e.y, dist=Math.hypot(dx,dy);
    if(dist<=d){ e.x=tx; e.y=ty; d-=dist; e.wp++; } else { e.x+=dx/dist*d; e.y+=dy/dist*d; d=0; }
  }
  e.prog+=sp*dt;
  if(e.wp>=PATH.length && !e.dead){ e.dead=true; lives-= e.boss?5:1; sfx('leak'); }
}
function hurt(e,d,pierce){
  if(e.dead) return;
  if(e.curse>0) d*=1.3;
  if(!pierce && e.armor) d=Math.max(d*0.25, d-e.armor);
  e.hp-=d;
  if(e.hp<=0){
    e.dead=true; gold+=e.reward; sfx(e.boss?'bossdie':'die');
    effects.push({k:'puff', x:e.x, y:e.y, life:0.7, max:0.7, txt:'+'+e.reward, big:e.boss});
    if(e.boss) showBanner(BOSS_DOWN[e.ty]||'Boss νικήθηκε!');
  }
}
function updateTower(tw,dt){
  tw.flash=Math.max(0,(tw.flash||0)-dt);
  if(tw.stone>0){ tw.stone-=dt; return; }
  tw.cd-=dt; if(tw.cd>0) return;
  const s=st(tw);
  const inR=enemies.filter(e=>!e.dead && Math.hypot(e.x-tw.x,e.y-tw.y)<=s.range).sort((a,b)=>b.prog-a.prog);
  if(!inR.length) return;
  tw.cd=s.rate; tw.flash=0.18; sfx('fire_'+tw.ty);
  const tg=inR[0];
  switch(tw.ty){
    case 'zeus': {
      const hits=[tg];
      for(let k=0;k<2;k++){
        const cur=hits[hits.length-1];
        const nx=enemies.filter(e=>!e.dead && !hits.includes(e) && Math.hypot(e.x-cur.x,e.y-cur.y)<95)
          .sort((a,b)=>Math.hypot(a.x-cur.x,a.y-cur.y)-Math.hypot(b.x-cur.x,b.y-cur.y))[0];
        if(nx) hits.push(nx); else break;
      }
      const pts=[[tw.x+18,tw.y-24]];
      hits.forEach((e,i)=>{ pts.push([e.x,e.y]); hurt(e,s.dmg*(i?0.6:1),true); });
      effects.push({k:'bolt', pts, life:0.2, max:0.2}); break;
    }
    case 'poseidon':
      inR.forEach(e=>{ hurt(e,s.dmg); e.slow=1.5; });
      effects.push({k:'ring', x:tw.x, y:tw.y, r:s.range, life:0.45, max:0.45, c:'90,190,240'}); break;
    case 'apollo':
      bullets.push({kind:'arrow', x:tw.x-14, y:tw.y-8, tg, dmg:s.dmg, sp:480, a:0}); break;
    case 'artemis': {
      const crit=Math.random()<0.25;
      bullets.push({kind:'silver', x:tw.x-14, y:tw.y-8, tg, dmg:s.dmg*(crit?2.5:1), crit, sp:620, a:0}); break;
    }
    case 'athena':
      bullets.push({kind:'spear', x:tw.x+14, y:tw.y-20, tg, dmg:s.dmg, sp:420, a:0}); break;
    case 'hades':
      bullets.push({kind:'soul', x:tw.x+14, y:tw.y-20, tg, dmg:s.dmg, sp:360, a:0}); break;
    case 'hephaestus':
      bullets.push({kind:'fire', x:tw.x+14, y:tw.y-18, tg, dmg:s.dmg, sp:330, a:0}); break;
  }
}
function bulletHit(b){
  const e=b.tg;
  if(b.kind==='fire'){
    enemies.forEach(o=>{ if(!o.dead && Math.hypot(o.x-e.x,o.y-e.y)<=55){ hurt(o,b.dmg,true); o.burnDps=Math.max(o.burn>0?o.burnDps:0, b.dmg*0.6); o.burn=3; } });
    effects.push({k:'ring', x:e.x, y:e.y, r:55, life:0.35, max:0.35, c:'255,130,40'});
  } else {
    if(b.kind==='soul') e.curse=3;
    hurt(e,b.dmg);
    if(b.crit) effects.push({k:'txt', x:e.x, y:e.y-24, life:0.6, max:0.6, txt:'ΚΡΙΤΙΚΟ!', c:'220,235,255'});
  }
}
function cast(k,x,y){
  const P=POWERS[k], m=1+0.22*Math.max(0,wave-1);
  pcd[k]=P.cd; casting=null;
  if(k==='meteor'){
    effects.push({k:'meteor', x, y, r:P.r, life:.6, max:.6}); sfx('whistle');
    timers.push({t:.6, fn:()=>{
      enemies.forEach(e=>{ const d=Math.hypot(e.x-x,e.y-y); if(!e.dead && d<=P.r){ hurt(e,140*m*(d<P.r*.5?1:.6),true); e.burnDps=Math.max(e.burn>0?e.burnDps:0,12*m); e.burn=4; } });
      effects.push({k:'boom', x, y, r:P.r, life:.6, max:.6});

        effects.push({k:'spark', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-180, life:.7+Math.random()*.4, max:1, c:i%3?'255,150,50':'90,60,40', s:2+Math.random()*3}); }

    msg('Μετεωρίτης!');

    for(let i=0;i<7;i++) timers.push({t:.08+i*.17, fn:()=>{
      const near=enemies.filter(e=>!e.dead && Math.hypot(e.x-x,e.y-y)<=P.r);

      else { const a=Math.random()*Math.PI*2, rr=Math.random()*P.r*.8; bx=x+Math.cos(a)*rr; by=y+Math.sin(a)*rr*.7; }
      enemies.forEach(e=>{ if(!e.dead && Math.hypot(e.x-bx,e.y-by)<=42) hurt(e,55*m,true); });
      effects.push({k:'bolt', pts:[[bx+(Math.random()-.5)*80, by-460],[bx,by]], life:.25, max:.25, w:6});
      effects.push({k:'ring', x:bx, y:by, r:42, life:.3, max:.3, c:'255,245,170'});
      decals.push({x:bx, y:by, r:16, life:4, max:4});
      shake=Math.max(shake,.18); flash=.35; sfx('crack');
    }});
    msg('Η οργή του Δία!');
  } else {
    enemies.forEach(e=>{ if(!e.dead && Math.hypot(e.x-x,e.y-y)<=P.r){ e.frozen=e.boss?1.5:3; hurt(e,10*m,true); } });
    effects.push({k:'ring', x, y, r:P.r, life:.5, max:.5, c:'170,230,255'});
    decals.push({x, y, r:P.r*.9, life:3, max:3, ice:true});
    for(let i=0;i<24;i++){ const a=Math.random()*Math.PI*2, v=40+Math.random()*120;
      effects.push({k:'spark', x:x+Math.cos(a)*20, y:y+Math.sin(a)*14, vx:Math.cos(a)*v, vy:Math.sin(a)*v*.6-60, g:40, life:.9, max:.9, c:'225,245,255', s:1.5+Math.random()*2}); }
    msg('Παγωνιά του Βορέα!'); sfx('chime');
  }
}
function update(dt){
  t+=dt;
  if(spawnQ.length){ spawnT-=dt; if(spawnT<=0){ spawn(spawnQ.shift()); spawnT=0.75;
    if(!spawnQ.length && wave<LEVELS[levelIdx].waves){ nextMax=Math.min(35,Math.round(16+wave*1.5+(LEVELS[levelIdx].ch?4:0))); nextT=nextMax; } } }
  if(nextT!==null){ nextT-=dt; if(nextT<=0){ nextT=0; startWave(); } }
  enemies.forEach(e=>moveEnemy(e,dt));
  towers.forEach(tw=>updateTower(tw,dt));
  bullets.forEach(b=>{
    const e=b.tg; if(e.dead){ b.done=true; return; }
    const dx=e.x-b.x, dy=e.y-b.y, d=Math.hypot(dx,dy), step=b.sp*dt;
    b.a=Math.atan2(dy,dx);
    if(d<=step+6){ bulletHit(b); b.done=true; } else { b.x+=dx/d*step; b.y+=dy/d*step; }
  });
  bullets=bullets.filter(b=>!b.done);
  enemies=enemies.filter(e=>!e.dead);
  effects.forEach(f=>{ f.life-=dt; if(f.vx!==undefined){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=(f.g!==undefined?f.g:320)*dt; } }); effects=effects.filter(f=>f.life>0);
  timers.forEach(tm=>{ tm.t-=dt; if(tm.t<=0 && !tm.done){ tm.done=true; tm.fn(); } }); timers=timers.filter(tm=>!tm.done);
  decals.forEach(d=>d.life-=dt); decals=decals.filter(d=>d.life>0);
  PORDER.forEach(k=>{ if(pcd[k]>0) pcd[k]=Math.max(0,pcd[k]-dt); });
  shake=Math.max(0,shake-dt); flash=Math.max(0,flash-dt*2); gateFlash=Math.max(0,gateFlash-dt);
  if(banner){ banner.life-=dt; if(banner.life<=0) banner=null; }
  if(lives<=0 && !over){ lives=0; over=true; onLose(); return; }
  if(waveActive && !spawnQ.length && !enemies.length){
    waveActive=false;
    let bonus=0; while(paidWave<wave){ paidWave++; bonus+=20+paidWave*5; } gold+=bonus;
    msg(`Κύμα ${wave} καθαρίστηκε! +${bonus} χρυσός` + (nextT!==null?` · Κάλεσε το επόμενο τώρα για extra χρυσό!`:''));
    if(wave>=LEVELS[levelIdx].waves){ won=true; onWin(); }
  }
}

  specks.forEach(([x,y,r])=>{
    if(!inView(x,y,10)) return;
    if(theme.water){ ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y+Math.sin(t*1.5+r*6)*2,5,Math.PI*1.15,Math.PI*1.85); ctx.stroke(); }

  });
  deco.forEach(o=>{ if(inView(o[0],o[1],40)) drawDeco(...o); });
  ctx.lineJoin='round'; ctx.lineCap='round';
  const stroke=(w,c)=>{ ctx.strokeStyle=c; ctx.lineWidth=w; ctx.beginPath(); PATH_DRAW.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke(); };

  drawDecals(); drawGate(GATE[0],GATE[1]);

/* ================= DRAW: FX ================= */
function drawFx(){
  bullets.forEach(b=>{
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.a);
    if(b.kind==='soul'){
      ctx.shadowColor='#b58cff'; ctx.shadowBlur=12;
      ctx.fillStyle='rgba(150,100,230,.5)'; ctx.beginPath(); ctx.ellipse(-8,0,9,3.5,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(200,165,255,.95)'; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
    } else if(b.kind==='fire'){
      ctx.fillStyle='rgba(255,90,20,.5)'; ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffc14d'; ctx.beginPath(); ctx.arc(0,0,4.5,0,Math.PI*2); ctx.fill();
    } else if(b.kind==='spear'){
      ctx.strokeStyle='#8a6a3a'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(4,0); ctx.stroke();
      ctx.fillStyle='#d8dde4'; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(3,-3.5); ctx.lineTo(3,3.5); ctx.fill();
    } else {
      if(b.kind==='silver'){ ctx.shadowColor='#cfe3ff'; ctx.shadowBlur=8; }
      ctx.strokeStyle=b.kind==='silver'?'#dfe8f5':'#ffd35a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(4,0); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(1,-3); ctx.lineTo(1,3); ctx.fill();
    }
    ctx.restore();
  });
  effects.forEach(f=>{
    const p=f.life/f.max;
    if(f.k==='bolt'){
      ctx.save(); ctx.shadowColor='#fff27a'; ctx.shadowBlur=12; ctx.globalAlpha=p;
      [[f.w||4,'#fff6a8'],[(f.w||4)*.4,'#ffffff']].forEach(([w,c])=>{
        ctx.strokeStyle=c; ctx.lineWidth=w; ctx.beginPath();
        for(let i=0;i<f.pts.length-1;i++){
          const [ax,ay]=f.pts[i], [bx,by]=f.pts[i+1];
          if(i===0) ctx.moveTo(ax,ay);
          for(let s=1;s<=6;s++){ const u=s/6, j=s<6?(Math.random()-.5)*14:0; ctx.lineTo(ax+(bx-ax)*u+j, ay+(by-ay)*u+j); }
        }
        ctx.stroke();
      });
      ctx.restore();
    } else if(f.k==='ring'){
      ctx.strokeStyle=`rgba(${f.c},${p})`; ctx.lineWidth=6*p+1;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(1-p*0.85),0,Math.PI*2); ctx.stroke();
    } else if(f.k==='puff'){
      ctx.fillStyle=`rgba(230,220,200,${p*.6})`; ctx.beginPath(); ctx.arc(f.x,f.y,(f.big?40:18)*(1.4-p),0,Math.PI*2); ctx.fill();
      ctx.fillStyle=`rgba(232,196,106,${p})`; ctx.font=`bold ${f.big?20:14}px Georgia`; ctx.textAlign='center';
      ctx.fillText(f.txt,f.x,f.y-20-(1-p)*20);
    } else if(f.k==='gaze'){
      ctx.save(); ctx.shadowColor=f.fire?'#ff6a1f':'#d8ff5a'; ctx.shadowBlur=10; ctx.strokeStyle=f.fire?`rgba(255,140,40,${p})`:`rgba(200,255,120,${p})`; ctx.lineWidth=f.fire?8:3;
      ctx.beginPath(); ctx.moveTo(f.x1,f.y1); ctx.lineTo(f.x2,f.y2); ctx.stroke(); ctx.restore();
    } else if(f.k==='meteor'){
      const q=1-p, mx=f.x+260*p, my=f.y-460*p;
      ctx.strokeStyle=`rgba(255,80,40,${.45+.35*Math.sin(t*20)})`; ctx.lineWidth=2; ctx.setLineDash([6,6]);
      ctx.beginPath(); ctx.ellipse(f.x,f.y,f.r*(1-q*.3),f.r*.6*(1-q*.3),0,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
      const g=ctx.createLinearGradient(mx,my,mx+100,my-175); g.addColorStop(0,'rgba(255,200,90,.95)'); g.addColorStop(1,'rgba(255,80,20,0)');
      ctx.strokeStyle=g; ctx.lineWidth=18; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(mx+100,my-175); ctx.stroke();
      ctx.save(); ctx.shadowColor='#ff7a2a'; ctx.shadowBlur=28;

function drawCampaign(){

    ctx.quadraticCurveTo(mx-dy/d*s2, my+dx/d*s2, x, y); });

    ctx.strokeStyle='#5a3f18'; ctx.lineWidth=4; ctx.stroke();
    if(un){ ctx.fillStyle='#3a2810'; ctx.font='bold 22px Georgia'; ctx.textAlign='center'; ctx.fillText(k+1,x,y+8); }
    else { ctx.fillStyle='#3a342c'; ctx.fillRect(x-8,y-2,16,12); ctx.strokeStyle='#3a342c'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,y-3,6,Math.PI,0); ctx.stroke(); }
    ctx.font='bold 14px Georgia'; const w=ctx.measureText(L.name).width+18;
    ctx.fillStyle='rgba(30,22,14,.85)'; ctx.fillRect(x-w/2,y+32,w,22);
    ctx.fillStyle=un?'#f3e6c4':'#a89c86'; ctx.textAlign='center'; ctx.fillText(L.name,x,y+48);
    if(un) for(let q=0;q<3;q++) drawStar(x-20+q*20,y+68,8,q<st2);
  });
  if(!open){ ctx.fillStyle='rgba(10,6,3,.45)'; ctx.fillRect(v.x,v.y,v.w,v.h); }
  ctx.textAlign='center'; ctx.font='bold 28px Georgia';
  ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillText(C.title,W/2+2,50);
  ctx.fillStyle='#f3e6c4'; ctx.fillText(C.title,W/2,48);

    if(i!==undefined){ if(levelUnlocked(i)) openLevel(i); else msg(`Η πίστα «${LEVELS[i].name}» είναι κλειδωμένη: νίκησε πρώτα την «${LEVELS[i-1].name}».`); }
    return;
  }
  if(over||won) return;
  if(canCallWave()){ const [wx,wy]=wcPos(); if(Math.hypot(p.x-wx,p.y-wy)<30){ startWave(); return; } }
  if(casting){
    if(onPath(p.x,p.y,34)) cast(casting,p.x,p.y); else msg('Οι δυνάμεις πέφτουν μόνο πάνω στον δρόμο των τεράτων.');
    return;
  }
  if(placing){
    const T=TYPES[placing];
    if(!canPlace(p.x,p.y)) msg('Δεν μπορείς να χτίσεις εκεί.');
    else if(gold<T.cost) msg('Δεν έχεις αρκετό χρυσό.');
    else { gold-=T.cost; towers.push({ty:placing,x:p.x,y:p.y,lvl:1,cd:0,spent:T.cost}); sfx('place'); if(gold<T.cost) placing=null; }
    return;
  }
  selected=towers.find(o=>Math.hypot(o.x-p.x,o.y-p.y)<28)||null;
  if(selected) msg(`${TYPES[selected.ty].name} (επίπεδο ${selected.lvl}): ${TYPES[selected.ty].desc}`);
});
addEventListener('keydown',ev=>{
  if(state!=='play') return;
  if(!$('modal').hidden){ if(ev.key==='Escape' && !over && !won) closeModal(); return; }
  const n=parseInt(ev.key); if(n>=1 && n<=ORDER.length) setPlacing(ORDER[n-1]);
  const pk=PORDER.find(k=>POWERS[k].key===ev.key.toUpperCase()); if(pk) setCasting(pk);
  if((ev.key==='u'||ev.key==='U') && selected) doUpgrade();
  if(ev.key==='Escape'){ if(placing||selected||casting){ placing=null; selected=null; casting=null; } else openPause(); }
  if(ev.key==='p'||ev.key==='P') openPause();
  if(ev.code==='Space'){ ev.preventDefault(); startWave(); }
});

/* ================= AUDIO (procedural, Web Audio API) ================= */
const SND={ctx:null, sfxG:null, musG:null, nbuf:null, last:{}, musicOn:true, sfxOn:true};
try{ const a=JSON.parse(localStorage.getItem('olympus-audio')); if(a){ SND.musicOn=a.music!==false; SND.sfxOn=a.sfx!==false; } }catch(e){}
function saveAudio(){ try{ localStorage.setItem('olympus-audio', JSON.stringify({music:SND.musicOn, sfx:SND.sfxOn})); }catch(e){} }
function audioInit(){
  if(SND.ctx){ if(SND.ctx.state==='suspended' && !document.hidden) SND.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  const c=SND.ctx=new AC();
  const comp=c.createDynamicsCompressor(); comp.connect(c.destination);
  SND.sfxG=c.createGain(); SND.sfxG.gain.value=SND.sfxOn?0.55:0; SND.sfxG.connect(comp);
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5200; lp.connect(comp);
  const rev=c.createConvolver(); rev.buffer=makeImpulse(c,2.8); const wet=c.createGain(); wet.gain.value=.38; rev.connect(wet); wet.connect(comp);
  SND.musG=c.createGain(); SND.musG.gain.value=SND.musicOn?0.32:0; SND.musG.connect(lp); SND.musG.connect(rev);
  SND.nbuf=c.createBuffer(1,c.sampleRate,c.sampleRate); const d=SND.nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  mBar=c.currentTime+0.2;
  setInterval(musicTick,90);
}
function setGain(g,v){ if(!SND.ctx) return; g.gain.cancelScheduledValues(SND.ctx.currentTime); g.gain.setTargetAtTime(v,SND.ctx.currentTime,0.08); }
function updateAudioBtns(){
  $('musBtn').classList.toggle('off',!SND.musicOn); $('sfxBtn').classList.toggle('off',!SND.sfxOn);
  if(SND.ctx){ setGain(SND.musG,SND.musicOn?0.32:0); setGain(SND.sfxG,SND.sfxOn?0.55:0); }
}
function env(g,t0,a,d,peak){ g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(peak,t0+a); g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); }
function osc(type,f,t0,dur,vol,f2,dest){
  const c=SND.ctx, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  env(g,t0,0.006,dur,vol); o.connect(g); g.connect(dest||SND.sfxG); o.start(t0); o.stop(t0+dur+0.05);
}
function noise(t0,dur,vol,ftype,fq,f2,dest){
  const c=SND.ctx, src=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  src.buffer=SND.nbuf; f.type=ftype; f.frequency.setValueAtTime(fq,t0); if(f2) f.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  env(g,t0,0.005,dur,vol); src.connect(f); f.connect(g); g.connect(dest||SND.sfxG); src.start(t0); src.stop(t0+dur+0.05);
}
const SFX={
  click:t=>osc('triangle',660,t,.05,.07),
  place:t=>{ osc('triangle',523,t,.25,.2); osc('triangle',784,t+.05,.3,.15); noise(t,.08,.1,'lowpass',800); },
  upgrade:t=>[523,659,784,1047].forEach((f,i)=>osc('triangle',f,t+i*.07,.25,.18)),
  sell:t=>{ osc('square',988,t,.08,.05); osc('square',740,t+.07,.12,.05); },
  coin:t=>{ osc('square',988,t,.07,.06); osc('square',1319,t+.06,.22,.06); },
  fire_apollo:t=>osc('triangle',1400,t,.06,.08,700),
  fire_artemis:t=>{ osc('sine',1800,t,.1,.07,900); noise(t,.05,.05,'highpass',3000); },
  fire_zeus:t=>{ noise(t,.25,.22,'highpass',2000,600); osc('sawtooth',90,t,.2,.1,40); },
  fire_poseidon:t=>{ noise(t,.45,.4,'lowpass',300,1500); osc('sine',180,t,.3,.08,120); },
  fire_athena:t=>noise(t,.15,.3,'bandpass',900,2000),
  fire_hephaestus:t=>{ osc('sine',120,t,.18,.25,60); noise(t,.1,.1,'bandpass',1800); },
  fire_hades:t=>{ osc('sine',300,t,.3,.07,600); osc('sine',303,t,.3,.05,590); },
  die:t=>{ noise(t,.12,.1,'bandpass',600,200); osc('square',220,t,.08,.035,110); },
  bossdie:t=>{ noise(t,1.2,.4,'lowpass',1200,80); osc('sawtooth',110,t,1,.18,30); },
  leak:t=>{ osc('triangle',330,t,.25,.2,220); osc('triangle',262,t+.18,.35,.2,160); },
  horn:t=>[146.8,220,293.7].forEach((f,i)=>osc('sawtooth',f,t+i*.02,.8,.045,f*1.01)),
  gong:t=>{ osc('sine',98,t,2.2,.3,92); osc('sine',147,t,1.8,.14,140); osc('sine',262,t,1.2,.07,255); noise(t,.3,.08,'lowpass',400); },
  whistle:t=>osc('sine',1400,t,.6,.1,180),
  boom:t=>{ noise(t,.9,.45,'lowpass',900,60); osc('sine',70,t,.6,.35,30); },
  crack:t=>{ noise(t,.35,.28,'highpass',3000,800); osc('sawtooth',70,t,.3,.1,35); },
  chime:t=>[1568,1976,2349,2637,3136].forEach((f,i)=>osc('sine',f,t+i*.05,.6,.06)),
  hiss:t=>noise(t,.4,.12,'highpass',2500,5000),
  summon:t=>{ osc('sawtooth',110,t,.8,.07,55); noise(t,.6,.1,'bandpass',500,150); },
  win:t=>[523,659,784,1047,784,1047].forEach((f,i)=>osc('triangle',f,t+i*.12,.4,.2)),
  lose:t=>[392,370,330,262].forEach((f,i)=>osc('triangle',f,t+i*.25,.5,.2))
};
const THR={fire_apollo:.07,fire_artemis:.08,fire_zeus:.06,fire_poseidon:.12,fire_athena:.09,fire_hephaestus:.09,fire_hades:.09,die:.05,hiss:.2,leak:.15,click:.03};
function sfx(name){
  if(!SND.ctx || !SND.sfxOn || SND.ctx.state!=='running') return;
  const now=SND.ctx.currentTime, lim=THR[name]||0;
  if(SND.last[name]!==undefined && now-SND.last[name]<lim) return;
  SND.last[name]=now; try{ SFX[name](now+0.01); }catch(e){}
}
/* music: ancient / Byzantine-style chant. A synthesized male choir (formant synthesis) sings fast "tu-ru-ru-ru"
   melismas that open into long swelling "AAAA" notes over an "ison" drone (the held low "Ooo" of Byzantine chant).
   Scale: D "hijaz" (D Eb F# G A Bb C). Battle: faster chant, frame drums in 7/8 and war shouts "HA!". */
const NOTE=n=>{ let pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[n[0]], i=1; if(n[1]==='#'){ pc++; i=2; } else if(n[1]==='b'){ pc--; i=2; } return 440*Math.pow(2,(pc+(+n.slice(i)-4)*12-9)/12); };
function makeImpulse(c,dur){
  const len=Math.floor(c.sampleRate*dur), b=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2); }
  return b;
}
let ksCache=new Map(), ksCtx=null;
function ksBuf(f){
  const c=SND.ctx; if(ksCtx!==c){ ksCache=new Map(); ksCtx=c; }
  const key=Math.round(f*10); if(ksCache.has(key)) return ksCache.get(key);
  const sr=c.sampleRate, N=Math.max(2,Math.round(sr/f)), len=Math.floor(sr*2.4), buf=c.createBuffer(1,len,sr), d=buf.getChannelData(0), ring=new Float32Array(N);
  let prev=0; for(let i=0;i<N;i++){ prev=prev*.45+(Math.random()*2-1)*.55; ring[i]=prev; }
  const decay = f<160 ? .9985 : f<330 ? .997 : .995;
  let idx=0; for(let i=0;i<len;i++){ const a=ring[idx], nx=ring[(idx+1)%N]; d[i]=a; ring[idx]=decay*.5*(a+nx); idx=(idx+1)%N; }
  ksCache.set(key,buf); return buf;
}
function kithara(fq,t,v){
  const c=SND.ctx, src=c.createBufferSource(), g=c.createGain(), f=c.createBiquadFilter();
  src.buffer=ksBuf(fq); f.type='lowpass'; f.frequency.value=3400; g.gain.value=v;
  src.connect(f); f.connect(g); g.connect(SND.musG); src.start(t); src.stop(t+2.4);
}
function tympanon(t,deep){ osc('sine',deep?95:170,t,deep?.35:.12,deep?.55:.22,deep?48:110,SND.musG); noise(t,deep?.08:.05,deep?.12:.15,'bandpass',deep?250:1600,0,SND.musG); }
function krotala(t,v){ osc('sine',2960,t,.28,.035*(v||1),0,SND.musG); osc('sine',4410,t,.2,.022*(v||1),0,SND.musG); }

/* ---- choir voice (formant synthesis) ---- */
const FORM={A:[800,1200,2850], O:[480,840,2800], U:[350,780,2450]};
function makeBank(n,octave,spread){
  const c=SND.ctx, out=c.createGain(), pre=c.createGain(); out.gain.value=0.0001; pre.gain.value=1/n;
  const fl=[0,1,2].map(k=>{ const f=c.createBiquadFilter(), g=c.createGain(); f.type='bandpass'; f.Q.value=[5,7,9][k]; f.frequency.value=FORM.A[k]; g.gain.value=[1.6,.9,.45][k]; pre.connect(f); f.connect(g); g.connect(out); return f; });
  const lfo=c.createOscillator(), lfoG=c.createGain(); lfo.frequency.value=5.4; lfoG.gain.value=0; lfo.connect(lfoG); lfo.start();
  const oscs=[];
  for(let i=0;i<n;i++){ const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=110; o.detune.value=(Math.random()-.5)*spread; lfoG.connect(o.detune); o.connect(pre); o.start(); oscs.push({o, mul: octave && i%3===2 ? .5 : 1}); }
  out.connect(SND.musG);
  return {c,out,fl,oscs,lfoG};
}
function ensureBanks(){ const c=SND.ctx; if(SND.lead && SND.lead.c===c) return; SND.lead=makeBank(6,true,24); SND.ison=makeBank(4,true,16); }
function setPitch(b,f,t,glide){ b.oscs.forEach(x=>x.o.frequency.setTargetAtTime(f*x.mul,t,glide)); }
function setVowel(b,v,t){ FORM[v].forEach((fr,i)=>b.fl[i].frequency.setTargetAtTime(fr,t,.025)); }
function chant(ph,t,beat,vol){
  const L=SND.lead, g=L.out.gain; let tt=t;
  ph.forEach(([n,bt,syl,vow])=>{
    const d=bt*beat;
    if(syl==='-'){ g.setTargetAtTime(0.0001,tt,.06); L.lfoG.gain.setTargetAtTime(0,tt,.05); tt+=d; return; }
    const f=NOTE(n)/2;
    setVowel(L,vow,tt);
    if(syl==='tu'){
      setPitch(L,f,tt,.008); L.lfoG.gain.setTargetAtTime(0,tt,.02);
      g.setTargetAtTime(0.0001,tt-.012,.005); g.setTargetAtTime(vol,tt+.015,.012);
      noise(tt,.035,vol*.45,'highpass',3500,0,SND.musG);
    } else if(syl==='ru'){
      setPitch(L,f,tt,.012); g.setTargetAtTime(vol*.3,tt,.006); g.setTargetAtTime(vol,tt+.035,.012);
    } else if(syl==='ha'){
      setPitch(L,f,tt,.005); L.lfoG.gain.setTargetAtTime(0,tt,.01);
      g.setTargetAtTime(vol*1.8,tt,.008); g.setTargetAtTime(0.0001,tt+Math.min(.18,d*.7),.03);
      noise(tt,.09,vol*.6,'bandpass',1400,0,SND.musG);
    } else {
      setPitch(L,f,tt,.04); g.setTargetAtTime(vol*.85,tt,.03); g.setTargetAtTime(vol*1.35,tt+d*.25,d*.35);
      L.lfoG.gain.setTargetAtTime(0,tt,.02); L.lfoG.gain.setTargetAtTime(30,tt+d*.3,d*.25);
    }
    tt+=d;
  });
  return tt-t;
}
function isonAt(note,t,vol){ const I=SND.ison; setPitch(I,NOTE(note),t,.3); setVowel(I,'O',t); I.out.gain.setTargetAtTime(vol,t,.4); }
const cTR=(notes,v)=>notes.map((n,i)=>[n,.5,i?'ru':'tu',v||'U']);
const cHold=(n,b,v)=>[[n,b,'A',v||'A']];
const cHa=n=>[[n,.75,'ha','A']];
const cRest=b=>[[null,b,'-']];
const CALM_PH=[
  {ph:[...cTR(['A4','Bb4','A4','G4','F#4','G4']),...cHold('A4',4),...cRest(1)], ison:'D3'},
  {ph:[...cTR(['A4','Bb4','C5','Bb4','A4','Bb4']),...cHold('D5',4),...cRest(1)], ison:'D3'},
  {ph:[...cTR(['C5','Bb4','A4','G4','F#4','Eb4']),...cHold('D4',4,'O'),...cRest(1)], ison:'D3'},
  {ph:[...cTR(['D4','Eb4','F#4','G4','A4','G4']),...cHold('A4',3),...cTR(['G4','F#4','Eb4']),...cHold('D4',5,'O'),...cRest(1.5)], ison:'D3'}
];
const BATTLE_PH=[
  {ph:[...cTR(['D4','Eb4','F#4','G4']),...cHold('A4',2),...cHa('D4'),...cHa('D4'),...cRest(.5)], ison:'D3'},
  {ph:[...cTR(['A4','Bb4','A4','G4']),...cHold('F#4',2),...cHa('D4'),...cHa('D4'),...cRest(.5)], ison:'D3'},
  {ph:[...cTR(['G4','A4','Bb4','C5']),...cHold('D5',3),...cRest(.5)], ison:'A2'},
  {ph:[...cTR(['C5','Bb4','A4','G4','F#4','Eb4']),...cHold('D4',2,'O'),...cHa('D4'),...cHa('D4'),...cHa('D4'),...cRest(.5)], ison:'D3'}
];
let mBar=0, mIdx=0, mTheme='calm';
function schedulePhrase(t){
  ensureBanks();
  const battle=mTheme==='battle', list=battle?BATTLE_PH:CALM_PH, P=list[mIdx%list.length], beat=battle?.24:.34;
  isonAt(P.ison,t,battle?.4:.32);
  const dur=chant(P.ph,t,beat,battle?1.05:.9);
  if(battle){
    const e=beat/2;
    for(let k=0,x=0; x<dur-.01; k++, x+=e){ const p=k%7; if(p===0) tympanon(t+x,true); else if(p===3||p===5) tympanon(t+x,false); if(p===3 && (k/7|0)%2) krotala(t+x,.8); }
  } else {
    kithara(NOTE(P.ison),t,.35); kithara(NOTE(P.ison)*1.5,t+beat*2,.22);
  }
  return dur;
}
function musicTick(){
  const c=SND.ctx; if(!c || c.state!=='running' || !SND.musicOn){ if(c) mBar=c.currentTime+0.1; return; }
  const want=(state==='play' && waveActive && !over && !won)?'battle':'calm';
  if(mBar<c.currentTime) mBar=c.currentTime+0.05;
  while(mBar < c.currentTime+0.6){
    if(want!==mTheme){ mTheme=want; mIdx=0; }
    mBar+=schedulePhrase(mBar); mIdx++;
  }
}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,audioInit,{passive:true}));
document.addEventListener('visibilitychange',()=>{ if(!SND.ctx) return; if(document.hidden) SND.ctx.suspend(); else SND.ctx.resume(); });
document.addEventListener('click',e=>{ if(e.target.closest && e.target.closest('button')) sfx('click'); });
$('musBtn').onclick=()=>{ SND.musicOn=!SND.musicOn; saveAudio(); updateAudioBtns(); };
$('sfxBtn').onclick=()=>{ SND.sfxOn=!SND.sfxOn; saveAudio(); updateAudioBtns(); };
addEventListener('keydown',ev=>{ if(ev.key==='m'||ev.key==='M'){ const on=!(SND.musicOn||SND.sfxOn); SND.musicOn=SND.sfxOn=on; saveAudio(); updateAudioBtns(); msg(on?'Ήχος ενεργός':'Ήχος σε σίγαση'); } });
updateAudioBtns();

/* ================= BOOT ================= */
loadMap(0); showWorld();
if(innerHeight>innerWidth && innerWidth<700) msg('Συμβουλή: γύρισε το κινητό οριζόντια για μεγαλύτερο χάρτη.');
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='play' && !over && !won && $('modal').hidden){ for(let i=0;i<speed;i++){ update(dt); if(over||won) break; } } else t+=dt;
  render(); hud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
