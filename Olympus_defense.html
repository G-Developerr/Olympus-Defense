        * {

        }
        
        #app {
            display: flex;
            flex-direction: column;

        }
        
        #top {
            display: flex;
            align-items: center;
            gap: 6px 10px;
            padding: 6px 10px;
            background: #221c14;
            border-bottom: 2px solid #5a4520;
            flex-wrap: wrap
        }
        
        #title {
            color: #e8c46a;
            letter-spacing: 2px;
            font-weight: bold;
            font-size: clamp(13px, 1.6vw, 19px);
            white-space: nowrap
        }
        
        .stat {

            white-space: nowrap
        }
        
        .stat b {
            color: #e8c46a
        }
        
        .sp {
            flex: 1
        }
        
        #mid {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column
        }
        
        #stage {
            flex: 1;
            min-height: 0;
            position: relative
        }
        
        canvas#c {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair
        }
        
        #dock {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 6px 10px;
            background: #221c14;
            border-top: 2px solid #5a4520;
            align-items: center
        }
        
        #towerBtns,
        #powerBtns {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }
        
        button {
            background: #2c241a;
            color: #f3e6c4;
            border: 2px solid #8a6d2f;
            border-radius: 8px;
            padding: 6px 10px;
            font-family: inherit;
            font-size: clamp(11px, 1.25vw, 14px);
            cursor: pointer;
            touch-action: manipulation
        }
        
        button:hover:not(:disabled) {
            border-color: #e8c46a
        }
        
        button.sel {
            background: #8a6d2f;
            color: #1b1712
        }
        
        button:disabled {
            opacity: .4;
            cursor: default
        }

            align-items: center;
            gap: 6px;
            padding: 2px 10px 2px 3px;
            text-align: left;
            line-height: 1.15
        }
        
        .tb canvas {
            width: 38px;
            height: 38px;
            flex: none
        }
        
        .tb small {
            display: block;
            color: #e8c46a
        }
        
        .tb.sel small {
            color: #1b1712
        }
        
        .tb.locked {
            border-style: dashed;
            opacity: .45
        }
        
        .tb.locked small {
            color: #bfae86
        }
        
        .pb {
            border-color: #9a6fd0;
            background: #3a2650
        }
        
        .pb small {
            color: #d6b8ff
        }
        
        .pb.sel {
            background: #9a6fd0!important;
            color: #1b1712
        }
        
        .pb.sel small {
            color: #1b1712
        }
        
        .pb:disabled {
            opacity: .75
        }
        
        .sepv {
            width: 2px;
            align-self: stretch;
            background: #5a4520;
            margin: 0 4px
        }
        
        body.side .sepv {
            width: auto;
            height: 2px;
            margin: 4px 0
        }
        
        #info {
            padding: 4px 10px;
            font-size: clamp(11px, 1.2vw, 13px);
            color: #d9c89a;
            background: #1b1712;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        body.side #mid {
            flex-direction: row
        }
        
        body.side #dock {
            flex-direction: column;
            flex-wrap: nowrap;
            width: 168px;
            border-top: 0;
            border-left: 2px solid #5a4520;
            overflow-y: auto;
            align-items: stretch;
            padding: 6px

        body.side #towerBtns,

        body.side #info {

            justify-content: center;

        }

            border: 3px solid #8a6d2f;
            border-radius: 12px;
            padding: 18px 20px;

            text-align: center;

            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 12px

        }

            color: #1b1712;

            height: 100%;

        }

        }

            height: 56px;

</head>

        /* ================= GEOMETRY ================= */
        function distSeg(px, py, ax, ay, bx, by) {
            const dx = bx - ax,
                dy = by - ay,
                l = dx * dx + dy * dy;
            let u = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0;
            u = Math.max(0, Math.min(1, u));
            return Math.hypot(px - ax - u * dx, py - ay - u * dy);
        }

        function nearPts(pts, x, y, m) {
            for (let i = 0; i < pts.length - 1; i++)
                if (distSeg(x, y, ...pts[i], ...pts[i + 1]) < m) return true;
            return false;
        }
        const onPath = (x, y, m) => nearPts(PATH, x, y, m);

            const [ex, ey] = PATH[PATH.length - 1];
            return x > 25 && x < W - 25 && y > 35 && y < H - 25 && !onPath(x, y, 48) &&

        }

        function loadMap(i) {
            levelIdx = i;

            let s0 = 0;
            for (; s0 < d; s0 += 2) {
                const x = a[0] + (b[0] - a[0]) * s0 / d,
                    y = a[1] + (b[1] - a[1]) * s0 / d;
                if (x >= 60 && x <= W - 60 && y >= 65 && y <= H - 40) break;
            }
            GATE = [a[0] + (b[0] - a[0]) * s0 / d, a[1] + (b[1] - a[1]) * s0 / d];

            deco = [];
            specks = [];

            const rnd = () => {
                s = (s * 9301 + 49297) % 233280;
                return s / 233280;
            };
            const [ex, ey] = PATH[PATH.length - 1];
            for (let k = 0; k < 1500 && deco.length < 70; k++) {
                const x = -W * 0.6 + rnd() * W * 2.2,
                    y = -H * 0.6 + rnd() * H * 2.2;
                if (!nearPts(PATH_DRAW, x, y, 62) && Math.hypot(x - ex, y - ey) > 90 && Math.hypot(x - GATE[0], y - GATE[1]) > 95 && !deco.some(o => Math.hypot(o[0] - x, o[1] - y) < 62)) deco.push([x, y, 11 + rnd() * 6, rnd()]);
            }
            for (let k = 0; k < 900; k++) specks.push([-W * 0.6 + rnd() * W * 2.2, -H * 0.6 + rnd() * H * 2.2, rnd()]);
        } {

                s = (s * 9301 + 49297) % 233280;

        /* ================= GAME LOGIC ================= */
        const unlocked = ty => !!avail[ty];

        function buffOf(tw) {
            let b = 1;

                if (a.ty === 'athena' && a !== tw && Math.hypot(a.x - tw.x, a.y - tw.y) <= AURA) b = Math.max(b, 1.15 + 0.1 * a.lvl);

                range: T.range * (1 + 0.12 * (tw.lvl - 1)),
                dmg: T.dmg * Math.pow(1.5, tw.lvl - 1) * buffOf(tw),

                    if (ty === 'harpy' && r2 < .45) ty = 'centaur';
                    else if ((ty === 'cyclops' || ty === 'minotaur') && wave >= 3 && r2 < .3) ty = 'medusa';

        function spawn(ty) {

        function moveEnemy(e, dt) {
            const sp = e.frozen > 0 ? 0 : e.speed * (e.slow > 0 ? 0.5 : 1) * (e.ty === 'cerberus' && e.hp < e.max * .5 ? 1.6 : 1);
            e.slow -= dt;
            if (e.frozen > 0) e.frozen -= dt;
            if (e.curse > 0) e.curse -= dt;
            if (e.ty === 'medusa' && !(e.frozen > 0)) {
                e.gaze -= dt;
                if (e.gaze <= 0) {
                    const tw = towers.filter(o => !(o.stone > 0) && Math.hypot(o.x - e.x, o.y - e.y) <= 130).sort((a, b) => Math.hypot(a.x - e.x, a.y - e.y) - Math.hypot(b.x - e.x, b.y - e.y))[0];
                    e.gaze = tw ? 4.5 : 0.5;
                    if (tw) {
                        tw.stone = 2.2;
                        effects.push({
                            k: 'gaze',
                            x1: e.x,
                            y1: e.y - 10,
                            x2: tw.x,
                            y2: tw.y - 14,
                            life: .5,
                            max: .5
                        });
                    }
                }
            }
            if (e.burn > 0) {
                e.burn -= dt;
                hurt(e, e.burnDps * dt, true);
            }
            if (e.regen && !e.dead) e.hp = Math.min(e.max, e.hp + e.max * e.regen * dt);
            let d = sp * dt;
            while (d > 0 && e.wp < PATH.length) {
                const [tx, ty] = PATH[e.wp], dx = tx - e.x, dy = ty - e.y, dist = Math.hypot(dx, dy);
                if (dist <= d) {
                    e.x = tx;
                    e.y = ty;
                    d -= dist;
                    e.wp++;
                } else {
                    e.x += dx / dist * d;
                    e.y += dy / dist * d;
                    d = 0;
                }
            }
            e.prog += sp * dt;
            if (e.wp >= PATH.length && !e.dead) {
                e.dead = true;
                lives -= e.boss ? 5 : 1;
            }
        }

        function hurt(e, d, pierce) {
            if (e.dead) return;
            if (e.curse > 0) d *= 1.3;
            if (!pierce && e.armor) d = Math.max(d * 0.25, d - e.armor);

        function updateTower(tw, dt) {
            tw.flash = Math.max(0, (tw.flash || 0) - dt);

            tw.cd -= dt;
            if (tw.cd > 0) return;
            const s = st(tw);
            const inR = enemies.filter(e => !e.dead && Math.hypot(e.x - tw.x, e.y - tw.y) <= s.range).sort((a, b) => b.prog - a.prog);
            if (!inR.length) return;
            tw.cd = s.rate;
            tw.flash = 0.18;
            const tg = inR[0];
            switch (tw.ty) {
                case 'zeus':
                    {
                        const hits = [tg];
                        for (let k = 0; k < 2; k++) {
                            const cur = hits[hits.length - 1];
                            const nx = enemies.filter(e => !e.dead && !hits.includes(e) && Math.hypot(e.x - cur.x, e.y - cur.y) < 95)

                        tg,
                        dmg: s.dmg,
                        sp: 420,

                        kind: 'soul',

                        sp: 360,
                        a: 0

                        dmg: s.dmg,
                        sp: 330,
                        a: 0

        function cast(k, x, y) {

                        for (let i = 0; i < 18; i++) {
                            const a = Math.random() * Math.PI * 2,
                                v = 120 + Math.random() * 220;
                            effects.push({
                                k: 'spark',
                                x,
                                y,
                                vx: Math.cos(a) * v,
                                vy: Math.sin(a) * v - 180,
                                life: .7 + Math.random() * .4,
                                max: 1,
                                c: i % 3 ? '255,150,50' : '90,60,40',
                                s: 2 + Math.random() * 3
                            });
                        }
                        shake = .5;
                        flash = .25;
                    }
                });
                msg('Μετεωρίτης!');
            } else if (k === 'storm') {
                for (let i = 0; i < 7; i++) timers.push({
                    t: .08 + i * .17,
                    fn: () => {
                        const near = enemies.filter(e => !e.dead && Math.hypot(e.x - x, e.y - y) <= P.r);
                        let bx, by;
                        if (near.length && Math.random() < .7) {
                            const e = near[Math.random() * near.length | 0];
                            bx = e.x;
                            by = e.y;
                        } else {
                            const a = Math.random() * Math.PI * 2,
                                rr = Math.random() * P.r * .8;
                            bx = x + Math.cos(a) * rr;
                            by = y + Math.sin(a) * rr * .7;
                        }
                        enemies.forEach(e => {
                            if (!e.dead && Math.hypot(e.x - bx, e.y - by) <= 42) hurt(e, 55 * m, true);
                        });
                        effects.push({
                            k: 'bolt',
                            pts: [
                                [bx + (Math.random() - .5) * 80, by - 460],
                                [bx, by]
                            ],
                            life: .25,
                            max: .25,
                            w: 6
                        });
                        effects.push({
                            k: 'ring',
                            x: bx,
                            y: by,
                            r: 42,
                            life: .3,
                            max: .3,
                            c: '255,245,170'
                        });
                        decals.push({
                            x: bx,
                            y: by,
                            r: 16,
                            life: 4,
                            max: 4
                        });
                        shake = Math.max(shake, .18);
                        flash = .35;
                    }
                });
                msg('Η οργή του Δία!');
            } else {
                enemies.forEach(e => {
                    if (!e.dead && Math.hypot(e.x - x, e.y - y) <= P.r) {
                        e.frozen = e.boss ? 1.5 : 3;
                        hurt(e, 10 * m, true);
                    }
                });
                effects.push({
                    k: 'ring',
                    x,
                    y,
                    r: P.r,
                    life: .5,
                    max: .5,
                    c: '170,230,255'
                });
                decals.push({
                    x,
                    y,
                    r: P.r * .9,
                    life: 3,
                    max: 3,
                    ice: true
                });
                for (let i = 0; i < 24; i++) {
                    const a = Math.random() * Math.PI * 2,
                        v = 40 + Math.random() * 120;
                    effects.push({
                        k: 'spark',
                        x: x + Math.cos(a) * 20,
                        y: y + Math.sin(a) * 14,
                        vx: Math.cos(a) * v,
                        vy: Math.sin(a) * v * .6 - 60,
                        g: 40,
                        life: .9,
                        max: .9,
                        c: '225,245,255',
                        s: 1.5 + Math.random() * 2
                    });
                }
                msg('Παγωνιά του Βορέα!');
            }
        }

        function update(dt) {
            t += dt;
            if (spawnQ.length) {
                spawnT -= dt;
                if (spawnT <= 0) {
                    spawn(spawnQ.shift());
                    spawnT = 0.75;
                }
            }
            enemies.forEach(e => moveEnemy(e, dt));
            towers.forEach(tw => updateTower(tw, dt));
            bullets.forEach(b => {
                const e = b.tg;
                if (e.dead) {
                    b.done = true;
                    return;
                }
                const dx = e.x - b.x,
                    dy = e.y - b.y,
                    d = Math.hypot(dx, dy),
                    step = b.sp * dt;
                b.a = Math.atan2(dy, dx);
                if (d <= step + 6) {
                    bulletHit(b);
                    b.done = true;
                } else {
                    b.x += dx / d * step;
                    b.y += dy / d * step;
                }
            });
            bullets = bullets.filter(b => !b.done);
            enemies = enemies.filter(e => !e.dead);
            effects.forEach(f => {
                f.life -= dt;
                if (f.vx !== undefined) {
                    f.x += f.vx * dt;
                    f.y += f.vy * dt;
                    f.vy += (f.g !== undefined ? f.g : 320) * dt;
                }
            });
            effects = effects.filter(f => f.life > 0);
            timers.forEach(tm => {
                tm.t -= dt;
                if (tm.t <= 0 && !tm.done) {
                    tm.done = true;
                    tm.fn();
                }
            });
            timers = timers.filter(tm => !tm.done);
            decals.forEach(d => d.life -= dt);
            decals = decals.filter(d => d.life > 0);
            PORDER.forEach(k => {
                if (pcd[k] > 0) pcd[k] = Math.max(0, pcd[k] - dt);
            });
            shake = Math.max(0, shake - dt);
            flash = Math.max(0, flash - dt * 2);
            gateFlash = Math.max(0, gateFlash - dt);
            if (banner) {
                banner.life -= dt;
                if (banner.life <= 0) banner = null;
            }
            if (lives <= 0 && !over) {
                lives = 0;
                over = true;
                onLose();
                return;
            }
            if (waveActive && !spawnQ.length && !enemies.length) {
                waveActive = false;
                const bonus = 20 + wave * 5;
                gold += bonus;
                msg(`Κύμα ${wave} ολοκληρώθηκε! +${bonus} χρυσός`);
                if (wave >= LEVELS[levelIdx].waves) {
                    won = true;
                    onWin();
                }
            }
        }

        function showBanner(txt) {
            banner = {
                txt,
                life: 3
            };
        }

        /* ================= DRAW: GAME WORLD ================= */
        function drawWorld() {
            const v = view();
            ctx.fillStyle = theme.bg;
            ctx.fillRect(v.x, v.y, v.w, v.h);
            const inView = (x, y, m) => x > v.x - m && x < v.x + v.w + m && y > v.y - m && y < v.y + v.h + m;
            specks.forEach(([x, y, r]) => {
                if (!inView(x, y, 10)) return;
                if (theme.water) {
                    ctx.strokeStyle = 'rgba(255,255,255,.18)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(x, y + Math.sin(t * 1.5 + r * 6) * 2, 5, Math.PI * 1.15, Math.PI * 1.85);
                    ctx.stroke();
                } else if (theme.deco === 'lava' && r < .08) {
                    ctx.fillStyle = `rgba(255,${90+r*800|0},40,${.4+.4*Math.sin(t*3+r*40)})`;
                    ctx.fillRect(x, y, 2, 2);
                } else {
                    ctx.fillStyle = r < .5 ? theme.s1 : theme.s2;
                    ctx.fillRect(x, y, 3, 2);
                }
            });
            deco.forEach(o => {
                if (inView(o[0], o[1], 40)) drawDeco(...o);
            });
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            const stroke = (w, c) => {
                ctx.strokeStyle = c;
                ctx.lineWidth = w;
                ctx.beginPath();
                PATH_DRAW.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
                ctx.stroke();
            };
            stroke(58, theme.edge);
            stroke(46, theme.fill);
            ctx.setLineDash([4, 14]);
            stroke(2, theme.dash);
            ctx.setLineDash([]);
            drawDecals();
            drawGate(GATE[0], GATE[1]);
            const [ex, ey] = PATH[PATH.length - 1];
            drawTemple(ex, ey - 10);
        }

        function drawDeco(x, y, r, v) {
            ctx.fillStyle = 'rgba(0,0,0,.18)';
            ctx.beginPath();
            ctx.ellipse(x + 4, y + r, r * 1.1, r * .45, 0, 0, Math.PI * 2);
            ctx.fill();
            switch (theme.deco) {
                case 'olive':
                    ctx.fillStyle = '#5b4430';
                    ctx.fillRect(x - 2, y, 4, r);
                    [
                        [-r * .5, -2, .8],
                        [r * .5, -2, .8],
                        [0, -r * .6, .9]
                    ].forEach(([dx, dy, s]) => {
                        ctx.fillStyle = '#8a9a6a';
                        ctx.beginPath();
                        ctx.arc(x + dx, y + dy, r * s, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.fillStyle = '#a3b184';
                    ctx.beginPath();
                    ctx.arc(x - 2, y - r * .7, r * .35, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'rock':
                case 'ruins':
                    {
                        const sand = theme.deco === 'ruins';
                        if (v < .35) {
                            ctx.fillStyle = sand ? '#efe3c2' : '#e6e0d0';
                            ctx.fillRect(x - 6, y - r, 12, r * 1.6);
                            ctx.fillStyle = sand ? '#cdb584' : '#c8c0ab';
                            ctx.fillRect(x + 3, y - r, 3, r * 1.6);
                            ctx.fillStyle = sand ? '#dcc99a' : '#d8d1bf';
                            ctx.fillRect(x - 9, y + r * .6, 18, 5);
                        } else if (sand && v < .6) {
                            ctx.fillStyle = '#a8844e';
                            ctx.fillRect(x - r, y - r * .5, r * 2, r);
                            ctx.fillStyle = '#c19c62';
                            ctx.fillRect(x - r, y - r * .5, r * 2, r * .35);
                        } else {
                            ctx.fillStyle = sand ? '#9c7c4c' : '#5d5548';
                            ctx.beginPath();
                            ctx.ellipse(x, y, r, r * .75, 0, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = sand ? '#b8955e' : '#766c5c';
                            ctx.beginPath();
                            ctx.ellipse(x - r * .25, y - r * .25, r * .45, r * .3, 0, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        break;
                    }
                case 'isle':
                    ctx.fillStyle = '#e3cf98';
                    ctx.beginPath();
                    ctx.ellipse(x, y + 4, r * 1.7, r * .9, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#7aa55a';
                    ctx.beginPath();
                    ctx.ellipse(x, y + 1, r * 1.1, r * .55, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(x - 4, y - 8, 8, 7);
                    ctx.fillStyle = '#2f6fb5';
                    ctx.beginPath();
                    ctx.arc(x, y - 8, 4, Math.PI, 0);
                    ctx.fill();
                    break;
                case 'lava':
                    if (v < .5) {
                        ctx.save();
                        ctx.shadowColor = '#ff5a1f';
                        ctx.shadowBlur = 14;
                        ctx.fillStyle = '#1c1014';
                        ctx.beginPath();
                        ctx.ellipse(x, y, r * 1.4, r * .8, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = `rgb(255,${100+40*Math.sin(t*2+v*20)|0},30)`;
                        ctx.beginPath();
                        ctx.ellipse(x, y, r * 1.1, r * .55, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    } else {
                        ctx.fillStyle = '#231519';
                        ctx.beginPath();
                        ctx.moveTo(x - r, y + r * .5);
                        ctx.lineTo(x - r * .3, y - r);
                        ctx.lineTo(x + r * .6, y - r * .4);
                        ctx.lineTo(x + r, y + r * .5);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = '#ff6a2a';
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(x - r * .3, y - r * .6);
                        ctx.lineTo(x, y);
                        ctx.lineTo(x + r * .3, y + r * .3);
                        ctx.stroke();
                    }
                    break;
                case 'magic':
                    if (v < .5) {
                        ctx.fillStyle = '#efe6f5';
                        ctx.fillRect(x - 2, y - 2, 4, r * .8);
                        ctx.save();
                        ctx.shadowColor = '#c77dff';
                        ctx.shadowBlur = 12;
                        ctx.fillStyle = '#8e4fc4';
                        ctx.beginPath();
                        ctx.ellipse(x, y - 2, r * .8, r * .55, 0, Math.PI, 0);
                        ctx.fill();
                        ctx.restore();
                        ctx.fillStyle = '#f3d9ff';
                        [
                            [-.4, -.25],
                            [.1, -.4],
                            [.45, -.15]
                        ].forEach(([a, c]) => {
                            ctx.beginPath();
                            ctx.arc(x + a * r, y - 2 + c * r, 1.6, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    } else {
                        ctx.save();
                        ctx.shadowColor = '#b58cff';
                        ctx.shadowBlur = 10 + 4 * Math.sin(t * 3 + v * 9);
                        [
                            [-.5, -.8, .25],
                            [.5, -.9, .28],
                            [0, -1.3, .35]
                        ].forEach(([dx, hh, w]) => {
                            ctx.fillStyle = dx ? '#9a6fd0' : '#c4a3ff';
                            ctx.beginPath();
                            ctx.moveTo(x + dx * r - w * r, y);
                            ctx.lineTo(x + dx * r, y + hh * r);
                            ctx.lineTo(x + dx * r + w * r, y);
                            ctx.closePath();
                            ctx.fill();
                        });
                        ctx.restore();
                    }
                    break;
                case 'whirl':
                    if (v < .4) {
                        ctx.save();
                        ctx.translate(x, y);
                        ctx.scale(1, .55);
                        ctx.rotate(t * 1.5 + v * 10);
                        ctx.strokeStyle = 'rgba(255,255,255,.5)';
                        ctx.lineWidth = 2;
                        for (let k = 0; k < 3; k++) {
                            ctx.beginPath();
                            ctx.arc(0, 0, r * (.5 + k * .45), k, k + Math.PI * 1.2);
                            ctx.stroke();
                        }
                        ctx.fillStyle = 'rgba(10,40,60,.6)';
                        ctx.beginPath();
                        ctx.arc(0, 0, r * .35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    } else {
                        ctx.fillStyle = '#4d5358';
                        ctx.beginPath();
                        ctx.moveTo(x - r, y + r * .4);
                        ctx.lineTo(x - r * .2, y - r * 1.1);
                        ctx.lineTo(x + r * .3, y - r * .5);
                        ctx.lineTo(x + r * .9, y + r * .4);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = `rgba(255,255,255,${.5+.3*Math.sin(t*2+v*9)})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.ellipse(x, y + r * .4, r * 1.1, r * .3, 0, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    break;
                case 'apple':
                    ctx.fillStyle = '#5b4430';
                    ctx.fillRect(x - 2, y, 4, r);
                    [
                        [-r * .5, -2, .85],
                        [r * .5, -2, .85],
                        [0, -r * .6, .95]
                    ].forEach(([dx, dy, s2]) => {
                        ctx.fillStyle = '#4f8a3a';
                        ctx.beginPath();
                        ctx.arc(x + dx, y + dy, r * s2, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.save();
                    ctx.shadowColor = '#ffd84a';
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = '#f2c94c';
                    [
                        [-.6, -.3],
                        [.4, -.7],
                        [.7, 0],
                        [-.1, -.1],
                        [-.3, -.9]
                    ].forEach(([a, c]) => {
                        ctx.beginPath();
                        ctx.arc(x + a * r, y + c * r, 2.4, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.restore();
                    break;
                case 'war':
                    {
                        const sx = v < .5 ? r * .3 : 0;
                        if (v < .5) {
                            ctx.strokeStyle = '#6b4a2a';
                            ctx.lineWidth = 2.5;
                            ctx.beginPath();
                            ctx.moveTo(x - r * .8, y + r * .5);
                            ctx.lineTo(x + r * .5, y - r * 1.2);
                            ctx.stroke();
                            ctx.fillStyle = '#b9bec6';
                            ctx.beginPath();
                            ctx.moveTo(x + r * .5, y - r * 1.2);
                            ctx.lineTo(x + r * .2, y - r * .75);
                            ctx.lineTo(x + r * .7, y - r * .85);
                            ctx.closePath();
                            ctx.fill();
                        }
                        ctx.fillStyle = '#8a2a1f';ctx.beginPath();ctx.ellipse(x + sx, y + r * .2, r * .7, r * .45, 0, 0, Math.PI * 2);ctx.fill();
                        ctx.strokeStyle = '#c9a24a';ctx.lineWidth = 2;ctx.stroke();
                        ctx.fillStyle = '#c9a24a';ctx.beginPath();ctx.arc(x + sx, y + r * .2, r * .15, 0, Math.PI * 2);ctx.fill();
                        break;
                    }
                case 'snow':
                    if (v < .55) {
                        ctx.fillStyle = '#5a4636';
                        ctx.fillRect(x - 2, y + r * .4, 4, r * .6);
                        ctx.fillStyle = '#3f5e4f';
                        ctx.beginPath();
                        ctx.moveTo(x, y - r * 1.4);
                        ctx.lineTo(x + r * .9, y + r * .5);
                        ctx.lineTo(x - r * .9, y + r * .5);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.moveTo(x, y - r * 1.4);
                        ctx.lineTo(x + r * .4, y - r * .5);
                        ctx.lineTo(x - r * .4, y - r * .5);
                        ctx.closePath();
                        ctx.fill();
                    } else {
                        ctx.fillStyle = '#8e98a3';
                        ctx.beginPath();
                        ctx.ellipse(x, y, r, r * .7, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.ellipse(x - r * .1, y - r * .35, r * .75, r * .35, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;
            }
        }

        function drawDecals() {
            decals.forEach(d => {
                const a = Math.min(1, d.life / d.max * 2);
                if (d.ice) {
                    ctx.fillStyle = `rgba(190,235,255,${.35*a})`;
                    ctx.strokeStyle = `rgba(235,250,255,${.7*a})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(d.x, d.y, d.r, d.r * .6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = `rgba(255,255,255,${.5*a})`;
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 6; i++) {
                        const g = i * Math.PI / 3;
                        ctx.beginPath();
                        ctx.moveTo(d.x, d.y);
                        ctx.lineTo(d.x + Math.cos(g) * d.r * .8, d.y + Math.sin(g) * d.r * .48);
                        ctx.stroke();
                    }
                } else {
                    const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r);
                    g.addColorStop(0, `rgba(20,10,5,${.75*a})`);
                    g.addColorStop(.6, `rgba(60,25,10,${.45*a})`);
                    g.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.ellipse(d.x, d.y, d.r, d.r * .65, 0, 0, Math.PI * 2);
                    ctx.fill();
                    if (d.glow) {
                        ctx.fillStyle = `rgba(255,110,30,${.55*a*(.6+.4*Math.sin(t*6))})`;
                        ctx.beginPath();
                        ctx.ellipse(d.x, d.y, d.r * .35, d.r * .22, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });
        }

        function drawGate(x, y) {
            const fl = gateFlash;
            ctx.save();
            ctx.fillStyle = 'rgba(25,10,12,.5)';
            ctx.beginPath();
            ctx.ellipse(x, y + 20, 68, 20, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = `rgba(255,90,30,${.5+.3*Math.sin(t*3)})`;
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x - 44, y + 24);
            ctx.lineTo(x - 28, y + 17);
            ctx.lineTo(x - 16, y + 26);
            ctx.moveTo(x + 46, y + 22);
            ctx.lineTo(x + 30, y + 16);
            ctx.lineTo(x + 20, y + 27);
            ctx.stroke();
            // vortex
            ctx.save();
            ctx.translate(x, y - 14);
            ctx.shadowColor = '#c43a8a';
            ctx.shadowBlur = 20 + fl * 40;
            const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 31);
            g.addColorStop(0, '#ffe0b0');
            g.addColorStop(.2, '#ff6a3a');
            g.addColorStop(.55, '#8a1f6a');
            g.addColorStop(1, '#1a0620');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.ellipse(0, 0, 23, 31, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.ellipse(0, 0, 23, 31, 0, 0, Math.PI * 2);
            ctx.clip();
            for (let k = 0; k < 4; k++) {
                ctx.save();
                ctx.scale(.75, 1);
                ctx.rotate(t * 2.2 + k * Math.PI / 2);
                ctx.strokeStyle = `rgba(255,${150+k*20},220,.55)`;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                for (let s = 0; s <= 1.001; s += .04) {
                    const r = 3 + s * 32,
                        a = s * 4.2;
                    if (s) ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                    else ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.stroke();
                ctx.restore();
            }
            ctx.restore();
            // stone pillars
            const stone = (sx, sy, w, h, i) => {
                ctx.fillStyle = i % 2 ? '#5e5751' : '#6d665e';
                ctx.fillRect(sx, sy, w, h);
                ctx.strokeStyle = '#2c2825';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(sx, sy, w, h);
            };
            for (let i = 0; i < 5; i++) {
                stone(x - 40, y + 6 - i * 12, 15, 12, i);
                stone(x + 25, y + 6 - i * 12, 15, 12, i + 1);
            }
            // arch
            ctx.strokeStyle = '#2c2825';
            ctx.lineWidth = 18;
            ctx.beginPath();
            ctx.arc(x, y - 42, 32.5, Math.PI, 0);
            ctx.stroke();
            ctx.strokeStyle = '#665f58';
            ctx.lineWidth = 15;
            ctx.beginPath();
            ctx.arc(x, y - 42, 32.5, Math.PI, 0);
            ctx.stroke();
            ctx.strokeStyle = '#2c2825';
            ctx.lineWidth = 1.5;
            for (let i = 1; i < 6; i++) {
                const a = Math.PI + i * Math.PI / 6;
                ctx.beginPath();
                ctx.moveTo(x + Math.cos(a) * 25, y - 42 + Math.sin(a) * 25);
                ctx.lineTo(x + Math.cos(a) * 40, y - 42 + Math.sin(a) * 40);
                ctx.stroke();
            }
            // spikes
            ctx.fillStyle = '#3a3430';
            [
                [x - 33, -1],
                [x + 33, 1]
            ].forEach(([hx, sgn]) => {
                ctx.beginPath();
                ctx.moveTo(hx - 6, y - 52);
                ctx.lineTo(hx + sgn * 12, y - 74);
                ctx.lineTo(hx + 6, y - 52);
                ctx.fill();
            });
            // keystone + glowing eye
            ctx.fillStyle = '#7a726a';
            ctx.beginPath();
            ctx.moveTo(x - 9, y - 85);
            ctx.lineTo(x + 9, y - 85);
            ctx.lineTo(x + 6, y - 66);
            ctx.lineTo(x - 6, y - 66);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.save();
            ctx.shadowColor = '#ff2a2a';
            ctx.shadowBlur = 10 + fl * 30;
            ctx.fillStyle = `rgb(255,${60+fl*350|0},40)`;
            ctx.beginPath();
            ctx.ellipse(x, y - 76, 4.5, 2.6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            // base step
            ctx.fillStyle = '#4a4440';
            ctx.fillRect(x - 46, y + 18, 92, 7);
            ctx.strokeRect(x - 46, y + 18, 92, 7);
            // torches
            [x - 56, x + 56].forEach((tx, i) => {
                ctx.fillStyle = '#4a3020';
                ctx.fillRect(tx - 2, y - 18, 4, 42);
                ctx.fillStyle = '#2c2825';
                ctx.beginPath();
                ctx.moveTo(tx - 8, y - 22);
                ctx.lineTo(tx + 8, y - 22);
                ctx.lineTo(tx + 4, y - 14);
                ctx.lineTo(tx - 4, y - 14);
                ctx.fill();
                const fh = 15 + Math.sin(t * 14 + i * 3) * 3 + Math.sin(t * 23 + i) * 2;
                ctx.save();
                ctx.shadowColor = '#ff8a2a';
                ctx.shadowBlur = 18;
                ctx.fillStyle = '#ff5a1f';
                ctx.beginPath();
                ctx.moveTo(tx - 7, y - 22);
                ctx.quadraticCurveTo(tx - 6, y - 22 - fh * .7, tx + Math.sin(t * 9 + i) * 2, y - 22 - fh);
                ctx.quadraticCurveTo(tx + 6, y - 22 - fh * .7, tx + 7, y - 22);
                ctx.fill();
                ctx.fillStyle = '#ffd35a';
                ctx.beginPath();
                ctx.moveTo(tx - 3.5, y - 22);
                ctx.quadraticCurveTo(tx - 3, y - 22 - fh * .45, tx, y - 22 - fh * .65);
                ctx.quadraticCurveTo(tx + 3, y - 22 - fh * .45, tx + 3.5, y - 22);
                ctx.fill();
                ctx.restore();
            });
            // embers
            for (let i = 0; i < 10; i++) {
                const ph = (t * .5 + i / 10) % 1,
                    ex = x + Math.sin(i * 7.3 + t * 1.3) * 22 * (1 - ph * .3),
                    ey = y - 10 - ph * 72;
                ctx.fillStyle = `rgba(255,${120+i*10},60,${(1-ph)*.9})`;
                ctx.beginPath();
                ctx.arc(ex, ey, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }
            if (fl > 0) {
                ctx.strokeStyle = `rgba(255,120,200,${Math.min(1,fl*2)})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(x, y - 14, 26 + (.4 - fl) * 60, 34 + (.4 - fl) * 60, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawTemple(x, y) {

        /* ================= DRAW: GODS ================= */
        function drawGod(ty, x, y, lvl, flash, alpha = 1, buffed = false, icon = false) {
            const bob = icon ? 0 : Math.sin(t * 3 + x) * 1.5;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            if (ty === 'athena' && !icon) {
                ctx.strokeStyle = 'rgba(232,196,106,.25)';
                ctx.setLineDash([3, 7]);
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 8, AURA, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            if (!icon) {
                ctx.fillStyle = 'rgba(0,0,0,.25)';
                ctx.beginPath();
                ctx.ellipse(3, 22, 24, 8, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#a8a08f';
            ctx.fillRect(-20, 12, 40, 8);
            ctx.beginPath();
            ctx.ellipse(0, 20, 20, 6, 0, 0, Math.PI);
            ctx.fill();
            ctx.fillStyle = buffed ? '#f0d98a' : '#e2dccd';
            ctx.beginPath();
            ctx.ellipse(0, 12, 20, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.translate(0, bob);
            const sash = {
                hades: '#7a4fa8',
                zeus: '#5b3fa0',
                poseidon: '#2b7fa8',
                apollo: '#e08a2c',
                artemis: '#3f6b4a',
                athena: '#6b6f7a',
                hephaestus: '#6b4226'
            }[ty];

            if (ty === 'apollo') {
                ctx.fillStyle = 'rgba(255,205,80,.35)';
                ctx.beginPath();
                ctx.arc(0, -16, 15 + (flash > 0 ? 3 : 0), 0, Math.PI * 2);
                ctx.fill();
            }
            if (ty === 'athena') {
                ctx.fillStyle = '#3a5a8c';
                ctx.beginPath();
                ctx.arc(-14, 2, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#d9b44a';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#d9b44a';
                ctx.beginPath();
                ctx.arc(-14, 2, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = ty === 'hephaestus' ? '#d8cfbd' : ty === 'hades' ? '#3a3340' : '#f4f1e8';
            ctx.beginPath();
            ctx.moveTo(-12, 12);
            ctx.lineTo(12, 12);
            ctx.lineTo(8, -6);
            ctx.lineTo(-8, -6);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#cfc9b8';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-3, 12);
            ctx.lineTo(-2, -2);
            ctx.moveTo(4, 12);
            ctx.lineTo(3, -2);
            ctx.stroke();
            if (ty === 'hephaestus') {
                ctx.fillStyle = sash;
                ctx.fillRect(-7, -3, 14, 15);
            } else {
                ctx.strokeStyle = sash;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-8, -5);
                ctx.lineTo(9, 8);
                ctx.stroke();
            }
            ctx.fillStyle = '#e9b98a';
            ctx.beginPath();
            ctx.arc(-11, 0, 3, 0, Math.PI * 2);
            ctx.arc(11, -2, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = ty === 'hephaestus' ? '#c9956a' : ty === 'hades' ? '#d8c8bc' : '#e9b98a';
            ctx.beginPath();
            ctx.arc(0, -14, 8, 0, Math.PI * 2);
            ctx.fill();

            const beard = (c, long) => {
                ctx.fillStyle = c;
                ctx.beginPath();
                ctx.arc(0, -16, 9, Math.PI * 1.05, Math.PI * 1.95);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-8, -13);
                ctx.quadraticCurveTo(0, long, 8, -13);
                ctx.quadraticCurveTo(0, -8, -8, -13);
                ctx.fill();
            };
            const bow = (c) => {
                ctx.strokeStyle = c;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(-6, -4, 15, Math.PI * 0.62, Math.PI * 1.38);
                ctx.stroke();
                ctx.strokeStyle = '#f3e6c4';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(-6 + 15 * Math.cos(Math.PI * 0.62), -4 + 15 * Math.sin(Math.PI * 0.62));
                ctx.lineTo(-6 + 15 * Math.cos(Math.PI * 1.38), -4 + 15 * Math.sin(Math.PI * 1.38));
                ctx.stroke();
            };

            if (ty === 'zeus') {
                beard('#f2f2f2', 4);
                ctx.save();
                if (flash > 0) {
                    ctx.shadowColor = '#fff27a';
                    ctx.shadowBlur = 14;
                }
                ctx.fillStyle = '#f5d742';
                ctx.beginPath();
                [
                    [14, -34],
                    [23, -34],
                    [18, -23],
                    [24, -23],
                    [11, -4],
                    [15, -17],
                    [9, -17]
                ].forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b));
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#b8961d';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
            } else if (ty === 'poseidon') {
                beard('#6fa9bb', 6);
                ctx.fillStyle = '#d9b44a';
                [-6, 0, 6].forEach(dx => {
                    ctx.beginPath();
                    ctx.moveTo(dx - 3, -21);
                    ctx.lineTo(dx, -28);
                    ctx.lineTo(dx + 3, -21);
                    ctx.fill();
                });
                ctx.strokeStyle = flash > 0 ? '#bff3ff' : '#d9b44a';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(15, 14);
                ctx.lineTo(15, -30);
                ctx.moveTo(8, -36);
                ctx.lineTo(8, -28);
                ctx.lineTo(22, -28);
                ctx.lineTo(22, -36);
                ctx.moveTo(15, -40);
                ctx.lineTo(15, -28);
                ctx.stroke();
            } else if (ty === 'apollo') {
                ctx.fillStyle = '#e8b93a';
                ctx.beginPath();
                ctx.arc(0, -16, 9, Math.PI * 0.95, Math.PI * 2.05);
                ctx.fill();
                [-8, 8].forEach(dx => {
                    ctx.beginPath();
                    ctx.arc(dx, -11, 3.2, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.fillStyle = '#5e8d3a';
                for (let i = 0; i < 7; i++) {
                    const a = Math.PI * (1.05 + i * 0.15);
                    ctx.beginPath();
                    ctx.ellipse(Math.cos(a) * 9, -16 + Math.sin(a) * 9, 3, 1.5, a + Math.PI / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                bow('#8a5a2b');
            } else if (ty === 'artemis') {
                ctx.fillStyle = '#7a3b1f';
                ctx.beginPath();
                ctx.arc(0, -16, 9, Math.PI * 0.95, Math.PI * 2.05);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(8, -8, 3, 7, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#eef3fa';
                ctx.beginPath();
                ctx.arc(0, -31, 6, Math.PI / 2, Math.PI * 1.5);
                ctx.quadraticCurveTo(-3, -31, 0, -25);
                ctx.fill();
                bow(flash > 0 ? '#ffffff' : '#b9c4d4');
            } else if (ty === 'athena') {
                ctx.fillStyle = '#c9a24a';
                ctx.beginPath();
                ctx.arc(0, -16, 9.5, Math.PI * 0.95, Math.PI * 2.05);
                ctx.fill();
                ctx.fillRect(-9, -16, 3, 6);
                ctx.fillRect(6, -16, 3, 6);
                ctx.fillStyle = '#b3302a';
                ctx.beginPath();
                ctx.ellipse(0, -27, 10, 4, 0, Math.PI, 0);
                ctx.fill();
                ctx.strokeStyle = '#8a6a3a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(14, 14);
                ctx.lineTo(14, -32);
                ctx.stroke();
                ctx.fillStyle = '#d8dde4';
                ctx.beginPath();
                ctx.moveTo(14, -42);
                ctx.lineTo(10, -31);
                ctx.lineTo(18, -31);
                ctx.fill();
            } else if (ty === 'hephaestus') {
                beard('#3b2a1e', 5);
                ctx.save();
                ctx.translate(14, -4);
                ctx.rotate(flash > 0 ? -0.9 : -0.2);
                ctx.fillStyle = '#6e4b2a';
                ctx.fillRect(-1.5, -20, 3, 22);
                ctx.fillStyle = flash > 0 ? '#ff8a30' : '#7d7d86';
                ctx.fillRect(-6, -26, 12, 8);
                ctx.restore();
                if (flash > 0) {
                    ctx.fillStyle = 'rgba(255,140,40,.7)';
                    for (let i = 0; i < 4; i++) {
                        ctx.beginPath();
                        ctx.arc(14 + Math.random() * 16 - 8, -28 + Math.random() * 10, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            } else if (ty === 'hades') {
                beard('#1a1418', 5);
                ctx.save();
                ctx.shadowColor = '#6fd0ff';
                ctx.shadowBlur = 10;
                ctx.fillStyle = 'rgba(120,210,255,.9)';
                [-6, 0, 6].forEach((dx, i) => {
                    const h = 7 + Math.sin(t * 10 + i * 2) * 2;
                    ctx.beginPath();
                    ctx.moveTo(dx - 3, -22);
                    ctx.quadraticCurveTo(dx, -22 - h * 1.4, dx + 3, -22);
                    ctx.fill();
                });
                ctx.restore();
                ctx.strokeStyle = flash > 0 ? '#c9a2ff' : '#6b5a7a';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(15, 14);
                ctx.lineTo(15, -30);
                ctx.moveTo(10, -38);
                ctx.lineTo(10, -28);
                ctx.lineTo(20, -28);
                ctx.lineTo(20, -38);
                ctx.stroke();
            }
            ctx.fillStyle = '#2a1d12';
            ctx.beginPath();
            ctx.arc(-3, -15, 1.2, 0, Math.PI * 2);
            ctx.arc(3, -15, 1.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            for (let i = 0; i < lvl; i++) {
                ctx.fillStyle = '#e8c46a';
                ctx.beginPath();
                ctx.arc(x - (lvl - 1) * 5 + i * 10, y + 30, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function powerIcon(k) {

                g.lineCap = 'round';

                g.beginPath();
                g.arc(30, 46, 14, 0, Math.PI * 2);
                g.fill();
                g.fillStyle = '#ffb347';
                g.beginPath();
                g.arc(27, 49, 8, 0, Math.PI * 2);
                g.fill();
            } else if (k === 'storm') {
                g.fillStyle = '#8d94a3';
                [
                    [26, 24, 13],
                    [40, 18, 15],
                    [54, 25, 12],
                    [38, 28, 14]
                ].forEach(([x, y, r]) => {
                    g.beginPath();
                    g.arc(x, y, r, 0, Math.PI * 2);
                    g.fill();
                });
                g.shadowColor = '#fff27a';
                g.shadowBlur = 10;
                g.fillStyle = '#f5d742';
                g.beginPath();
                [
                    [36, 34],
                    [48, 34],
                    [40, 48],
                    [50, 48],
                    [30, 70],
                    [36, 54],
                    [27, 54]
                ].forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
                g.closePath();
                g.fill();
            } else {
                g.strokeStyle = '#cfefff';
                g.lineWidth = 4;
                g.lineCap = 'round';
                g.shadowColor = '#8fd8ff';
                g.shadowBlur = 8;
                for (let i = 0; i < 6; i++) {
                    const a = i * Math.PI / 3,
                        ex = 38 + Math.cos(a) * 26,
                        ey = 38 + Math.sin(a) * 26;
                    g.beginPath();
                    g.moveTo(38, 38);
                    g.lineTo(ex, ey);
                    const bx = 38 + Math.cos(a) * 16,
                        by = 38 + Math.sin(a) * 16;
                    g.moveTo(bx, by);
                    g.lineTo(bx + Math.cos(a + .8) * 8, by + Math.sin(a + .8) * 8);
                    g.moveTo(bx, by);
                    g.lineTo(bx + Math.cos(a - .8) * 8, by + Math.sin(a - .8) * 8);
                    g.stroke();
                }
            }
            return c;
        }

        function godIcon(ty) {

        }

        /* ================= DRAW: MONSTERS ================= */

                    ctx.beginPath();

                });

                ctx.beginPath();
                ctx.ellipse(0, 5, 7, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.moveTo(-3, 14);
                ctx.lineTo(-4, 19);
                ctx.moveTo(3, 14);

                ctx.arc(0, -8, 7.5, Math.PI * 0.9, Math.PI * 2.1);
                ctx.fill();
                ctx.fillStyle = '#e8c9a8';
                ctx.beginPath();
                ctx.arc(0, -7, 5.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#c0282d';
                ctx.beginPath();
                ctx.arc(-2, -8, 1.2, 0, Math.PI * 2);
                ctx.arc(2, -8, 1.2, 0, Math.PI * 2);
                ctx.fill();
            } else if (e.ty === 'cyclops') {

                ctx.save();
                ctx.rotate(0.5 + b * 0.2);
                ctx.fillStyle = '#6e4b2a';
                ctx.fillRect(12, -18, 6, 26);
                ctx.fillStyle = '#5a3c20';
                ctx.beginPath();
                ctx.arc(15, -18, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                ctx.fillStyle = '#7d9a6a';
                ctx.beginPath();
                ctx.arc(0, 2, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#9bb487';
                ctx.beginPath();
                ctx.ellipse(0, 9, 10, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#6e4b2a';
                ctx.fillRect(-14, 10, 28, 5);
                ctx.fillStyle = '#e8e0cc';
                ctx.beginPath();
                ctx.moveTo(-3, -13);
                ctx.lineTo(0, -21);
                ctx.lineTo(3, -13);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, -4, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#b3302a';
                ctx.beginPath();
                ctx.arc(0, -4, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(0, -4, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#3d4d33';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-8, -12);
                ctx.lineTo(8, -11);

                ctx.fillStyle = '#2b1a14';
