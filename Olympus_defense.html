                ctx.fillStyle = '#fff';
                ctx.fillRect(-3, 5, 2, 2);
                ctx.fillRect(1, 5, 2, 2);
            } else if (e.ty === 'minotaur') {
                ctx.translate(0, Math.abs(b) * -1.5);
                ctx.fillStyle = '#6b3f24';
                ctx.beginPath();
                ctx.arc(0, 6, 17, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#57321c';
                ctx.beginPath();
                ctx.arc(-15, 6, 5, 0, Math.PI * 2);
                ctx.arc(15, 6, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#efe6d0';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-7, -14);
                ctx.quadraticCurveTo(-20, -14, -18, -26);
                ctx.moveTo(7, -14);
                ctx.quadraticCurveTo(20, -14, 18, -26);
                ctx.stroke();
                ctx.fillStyle = '#7a4a2a';
                ctx.beginPath();
                ctx.ellipse(0, -8, 11, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#c89b7b';
                ctx.beginPath();
                ctx.ellipse(0, -2, 7, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#3a1f10';
                ctx.beginPath();
                ctx.arc(-2.5, -2, 1.3, 0, Math.PI * 2);
                ctx.arc(2.5, -2, 1.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#e8c46a';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 1, 3, 0.2, Math.PI - 0.2);
                ctx.stroke();
                ctx.save();
                ctx.shadowColor = '#ff3b2f';
                ctx.shadowBlur = 6;
                ctx.fillStyle = '#ff4a3a';
                ctx.beginPath();
                ctx.arc(-5, -10, 1.8, 0, Math.PI * 2);
                ctx.arc(5, -10, 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            } else if (e.ty === 'talos') {
                ctx.translate(0, Math.abs(b) * -1.5);
                ctx.fillStyle = '#8a6428';
                ctx.fillRect(-9, 10, 7, 9);
                ctx.fillRect(2, 10, 7, 9);
                ctx.fillStyle = '#b8863b';
                ctx.beginPath();
                ctx.moveTo(-16, -8);
                ctx.lineTo(16, -8);
                ctx.lineTo(12, 12);
                ctx.lineTo(-12, 12);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#7a5520';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.fillStyle = '#7a5520';
                [
                    [-10, -3],
                    [10, -3],
                    [-8, 7],
                    [8, 7]
                ].forEach(([a, c]) => {
                    ctx.beginPath();
                    ctx.arc(a, c, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.fillStyle = '#a3772f';
                ctx.fillRect(-21, -8, 6, 16);
                ctx.fillRect(15, -8, 6, 16);
                ctx.fillStyle = '#c99a4a';
                ctx.fillRect(-7, -22, 14, 14);
                ctx.strokeRect(-7, -22, 14, 14);
                ctx.save();
                ctx.shadowColor = '#ff9a2f';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#ffb347';
                ctx.fillRect(-5, -17, 4, 2);
                ctx.fillRect(1, -17, 4, 2);
                ctx.restore();
            } else if (e.ty === 'hydra') {
                const heads = Math.max(1, Math.ceil(5 * e.hp / e.max)),
                    pos = [];
                for (let i = 0; i < heads; i++) {
                    const a = -Math.PI / 2 + (i - (heads - 1) / 2) * 0.5 + Math.sin(t * 3 + i) * 0.15;
                    pos.push([Math.cos(a) * 30, Math.sin(a) * 30 - 4]);
                }
                ctx.strokeStyle = '#2f6b3a';
                ctx.lineWidth = 7;
                ctx.lineCap = 'round';
                pos.forEach(([hx, hy]) => {
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(hx * 0.3, hy * 0.9, hx, hy);
                    ctx.stroke();
                });
                ctx.fillStyle = '#2f6b3a';
                ctx.beginPath();
                ctx.ellipse(0, 8, 26, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#4f8f4f';
                ctx.beginPath();
                ctx.ellipse(0, 12, 16, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                pos.forEach(([hx, hy]) => {
                    ctx.fillStyle = '#3d8a4a';
                    ctx.beginPath();
                    ctx.ellipse(hx, hy, 7, 5.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffd23a';
                    ctx.beginPath();
                    ctx.arc(hx - 2.5, hy - 1.5, 1.3, 0, Math.PI * 2);
                    ctx.arc(hx + 2.5, hy - 1.5, 1.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#c0282d';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(hx, hy + 4);
                    ctx.lineTo(hx, hy + 8);
                    ctx.stroke();
                });
            } else if (e.ty === 'centaur') {
                ctx.translate(0, Math.abs(b) * -2);
                ctx.strokeStyle = '#3a2616';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-17, 4);
                ctx.quadraticCurveTo(-24, 6 + b * 2, -22, 14);
                ctx.stroke();
                ctx.strokeStyle = '#5a3a1f';
                [-12, -6, 6, 11].forEach((lx, i) => {
                    ctx.beginPath();
                    ctx.moveTo(lx, 10);
                    ctx.lineTo(lx + Math.sin(t * 14 + i * 1.6) * 3, 19);
                    ctx.stroke();
                });
                ctx.fillStyle = '#8a5a32';
                ctx.beginPath();
                ctx.ellipse(-2, 6, 16, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#d9a67a';
                ctx.fillRect(7, -12, 8, 14);
                ctx.beginPath();
                ctx.arc(11, -16, 5.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#3a2616';
                ctx.beginPath();
                ctx.arc(11, -18, 5.8, Math.PI, 0);
                ctx.fill();
                ctx.strokeStyle = '#6b4a2a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(20, -8, 9, -Math.PI * .45, Math.PI * .45);
                ctx.stroke();
                ctx.fillStyle = '#c0282d';
                ctx.beginPath();
                ctx.arc(13, -16, 1.1, 0, Math.PI * 2);
                ctx.fill();
            } else if (e.ty === 'medusa') {
                ctx.translate(0, Math.abs(b) * -1);
                ctx.fillStyle = '#3f7a4a';
                ctx.beginPath();
                ctx.moveTo(-9, -2);
                ctx.quadraticCurveTo(-14, 14, 0, 16);
                ctx.quadraticCurveTo(16, 18, 18, 10 + b * 2);
                ctx.quadraticCurveTo(10, 12, 6, 8);
                ctx.lineTo(9, -2);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#6fa860';
                ctx.fillRect(-7, -6, 14, 10);
                ctx.strokeStyle = '#2f6b3a';
                ctx.lineWidth = 2.2;
                ctx.lineCap = 'round';
                for (let i = 0; i < 7; i++) {
                    const a = Math.PI * (1.0 + i * 0.167),
                        ex = Math.cos(a) * 14 + Math.sin(t * 8 + i) * 2.5,
                        ey = -12 + Math.sin(a) * 14;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a) * 5, -12 + Math.sin(a) * 5);
                    ctx.quadraticCurveTo(Math.cos(a) * 10 + Math.cos(t * 9 + i) * 3, -12 + Math.sin(a) * 10, ex, ey);
                    ctx.stroke();
                    ctx.fillStyle = '#2f6b3a';
                    ctx.beginPath();
                    ctx.arc(ex, ey, 1.9, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#a7c79a';
                ctx.beginPath();
                ctx.arc(0, -12, 6.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.save();
                if (e.gaze < 0.7) {
                    ctx.shadowColor = '#d8ff5a';
                    ctx.shadowBlur = 10;
                }
                ctx.fillStyle = '#e8f04a';
                ctx.beginPath();
                ctx.arc(-2.4, -13, 1.4, 0, Math.PI * 2);
                ctx.arc(2.4, -13, 1.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            } else if (e.ty === 'cerberus') {
                const rage = e.hp < e.max * .5;
                ctx.translate(0, Math.abs(b) * -2);
                ctx.fillStyle = '#2e2629';
                [-18, -8, 8, 18].forEach((lx, i) => ctx.fillRect(lx - 3, 14, 6, 10 + Math.sin(t * 12 + i * 1.7) * 2));
                ctx.strokeStyle = '#3d3236';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-24, 4);
                ctx.quadraticCurveTo(-34, 0, -34, -8 + b * 3);
                ctx.stroke();
                ctx.save();
                if (rage) {
                    ctx.shadowColor = '#ff2a1a';
                    ctx.shadowBlur = 22;
                }
                ctx.fillStyle = '#3d3236';
                ctx.beginPath();
                ctx.ellipse(0, 8, 26, 14, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#8a6a60';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
                [
                    [-16, -10, -0.35],
                    [0, -17, 0],
                    [16, -10, 0.35]
                ].forEach(([hx, hy, rot], i) => {
                    ctx.save();
                    ctx.translate(hx, hy + Math.sin(t * 5 + i) * 1.5);
                    ctx.rotate(rot);
                    ctx.fillStyle = '#4a3d42';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 9, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#8a6a60';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-8, -4);
                    ctx.lineTo(-6, -14);
                    ctx.lineTo(-2, -6);
                    ctx.moveTo(8, -4);
                    ctx.lineTo(6, -14);
                    ctx.lineTo(2, -6);
                    ctx.fill();
                    ctx.fillStyle = '#3a3033';
                    ctx.beginPath();
                    ctx.ellipse(0, 5, 5, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-3, 8, 1.5, 2.5);
                    ctx.fillRect(1.5, 8, 1.5, 2.5);
                    ctx.save();
                    ctx.shadowColor = '#ff3b2f';
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = '#ff4a3a';
                    ctx.beginPath();
                    ctx.arc(-3.5, -2, 1.6, 0, Math.PI * 2);
                    ctx.arc(3.5, -2, 1.6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    ctx.strokeStyle = '#b8863b';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(0, 2, 9, Math.PI * .15, Math.PI * .85);
                    ctx.stroke();
                    if (rage) {
                        ctx.fillStyle = `rgba(255,120,30,${.6+.4*Math.sin(t*12+i)})`;
                        ctx.beginPath();
                        ctx.arc(0, 13 + Math.abs(Math.sin(t * 6 + i)) * 4, 1.8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                });
            }
            if (e.curse > 0) {
                ctx.fillStyle = `rgba(150,90,220,${.22+.12*Math.sin(t*6)})`;
                ctx.beginPath();
                ctx.ellipse(0, 0, e.boss ? 30 : 18, e.boss ? 24 : 16, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            if (e.frozen > 0) {
                const s = e.boss ? 34 : 20;
                ctx.fillStyle = 'rgba(170,225,255,.45)';
                ctx.strokeStyle = 'rgba(230,248,255,.95)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-s, -s * .9);
                ctx.lineTo(s * .8, -s);
                ctx.lineTo(s, s * .8);
                ctx.lineTo(-s * .9, s);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = 'rgba(255,255,255,.65)';
                ctx.fillRect(-s * .6, -s * .7, s * .25, s * .9);
            }
            if (e.burn > 0) {
                ctx.fillStyle = 'rgba(255,120,30,.8)';
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.arc(-8 + i * 8, -16 - Math.abs(Math.sin(t * 10 + i)) * 6, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
            if (e.hp < e.max || e.boss) {
                const w = e.boss ? 60 : 28,
                    p = Math.max(0, e.hp / e.max),
                    yy = e.boss ? e.y - 46 : e.y - 34;
                ctx.fillStyle = '#2a1a12';
                ctx.fillRect(e.x - w / 2, yy, w, e.boss ? 6 : 4);
                ctx.fillStyle = p > .5 ? '#7ccf5a' : p > .25 ? '#e8c046' : '#e0513c';
                ctx.fillRect(e.x - w / 2, yy, w * p, e.boss ? 6 : 4);
            }
        }

        /* ================= DRAW: FX ================= */
        function drawFx() {
            bullets.forEach(b => {
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.a);
                if (b.kind === 'soul') {
                    ctx.shadowColor = '#b58cff';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = 'rgba(150,100,230,.5)';
                    ctx.beginPath();
                    ctx.ellipse(-8, 0, 9, 3.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(200,165,255,.95)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (b.kind === 'fire') {
                    ctx.fillStyle = 'rgba(255,90,20,.5)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffc14d';
                    ctx.beginPath();
                    ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (b.kind === 'spear') {
                    ctx.strokeStyle = '#8a6a3a';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(-16, 0);
                    ctx.lineTo(4, 0);
                    ctx.stroke();
                    ctx.fillStyle = '#d8dde4';
                    ctx.beginPath();
                    ctx.moveTo(10, 0);
                    ctx.lineTo(3, -3.5);
                    ctx.lineTo(3, 3.5);
                    ctx.fill();
                } else {
                    if (b.kind === 'silver') {
                        ctx.shadowColor = '#cfe3ff';
                        ctx.shadowBlur = 8;
                    }
                    ctx.strokeStyle = b.kind === 'silver' ? '#dfe8f5' : '#ffd35a';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-10, 0);
                    ctx.lineTo(4, 0);
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.moveTo(6, 0);
                    ctx.lineTo(1, -3);
                    ctx.lineTo(1, 3);
                    ctx.fill();
                }
                ctx.restore();
            });
            effects.forEach(f => {
                const p = f.life / f.max;
                if (f.k === 'bolt') {
                    ctx.save();
                    ctx.shadowColor = '#fff27a';
                    ctx.shadowBlur = 12;
                    ctx.globalAlpha = p;
                    [
                        [f.w || 4, '#fff6a8'],
                        [(f.w || 4) * .4, '#ffffff']
                    ].forEach(([w, c]) => {
                        ctx.strokeStyle = c;
                        ctx.lineWidth = w;
                        ctx.beginPath();
                        for (let i = 0; i < f.pts.length - 1; i++) {
                            const [ax, ay] = f.pts[i], [bx, by] = f.pts[i + 1];
                            if (i === 0) ctx.moveTo(ax, ay);
                            for (let s = 1; s <= 6; s++) {
                                const u = s / 6,
                                    j = s < 6 ? (Math.random() - .5) * 14 : 0;
                                ctx.lineTo(ax + (bx - ax) * u + j, ay + (by - ay) * u + j);
                            }
                        }
                        ctx.stroke();
                    });
                    ctx.restore();
                } else if (f.k === 'ring') {
                    ctx.strokeStyle = `rgba(${f.c},${p})`;
                    ctx.lineWidth = 6 * p + 1;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.r * (1 - p * 0.85), 0, Math.PI * 2);
                    ctx.stroke();
                } else if (f.k === 'puff') {
                    ctx.fillStyle = `rgba(230,220,200,${p*.6})`;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, (f.big ? 40 : 18) * (1.4 - p), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = `rgba(232,196,106,${p})`;
                    ctx.font = `bold ${f.big?20:14}px Georgia`;
                    ctx.textAlign = 'center';
                    ctx.fillText(f.txt, f.x, f.y - 20 - (1 - p) * 20);
                } else if (f.k === 'gaze') {
                    ctx.save();
                    ctx.shadowColor = '#d8ff5a';
                    ctx.shadowBlur = 10;
                    ctx.strokeStyle = `rgba(200,255,120,${p})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(f.x1, f.y1);
                    ctx.lineTo(f.x2, f.y2);
                    ctx.stroke();
                    ctx.restore();
                } else if (f.k === 'meteor') {
                    const q = 1 - p,
                        mx = f.x + 260 * p,
                        my = f.y - 460 * p;
                    ctx.strokeStyle = `rgba(255,80,40,${.45+.35*Math.sin(t*20)})`;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 6]);
                    ctx.beginPath();
                    ctx.ellipse(f.x, f.y, f.r * (1 - q * .3), f.r * .6 * (1 - q * .3), 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    const g = ctx.createLinearGradient(mx, my, mx + 100, my - 175);
                    g.addColorStop(0, 'rgba(255,200,90,.95)');
                    g.addColorStop(1, 'rgba(255,80,20,0)');
                    ctx.strokeStyle = g;
                    ctx.lineWidth = 18;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(mx, my);
                    ctx.lineTo(mx + 100, my - 175);
                    ctx.stroke();
                    ctx.save();
                    ctx.shadowColor = '#ff7a2a';
                    ctx.shadowBlur = 28;
                    ctx.fillStyle = '#5a2a14';
                    ctx.beginPath();
                    ctx.arc(mx, my, 15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffb347';
                    ctx.beginPath();
                    ctx.arc(mx - 3, my + 3, 9, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else if (f.k === 'boom') {
                    const q = 1 - p;
                    ctx.fillStyle = `rgba(255,${150+80*p|0},60,${p*.75})`;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.r * (.4 + q * .8), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = `rgba(255,230,160,${p})`;
                    ctx.lineWidth = 8 * p + 1;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.r * (.5 + q), 0, Math.PI * 2);
                    ctx.stroke();
                } else if (f.k === 'spark') {
                    ctx.fillStyle = `rgba(${f.c},${Math.min(1,p*1.3)})`;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.s || 3, 0, Math.PI * 2);
                    ctx.fill();
                } else if (f.k === 'txt') {
                    ctx.fillStyle = `rgba(${f.c},${p})`;
                    ctx.font = 'bold 12px Georgia';
                    ctx.textAlign = 'center';
                    ctx.fillText(f.txt, f.x, f.y - (1 - p) * 16);
                }
            });
        }

        function drawStone(tw) {
            ctx.save();
            ctx.globalAlpha = Math.min(1, tw.stone * 2) * .85;
            ctx.fillStyle = '#8d8a84';
            ctx.beginPath();
            ctx.ellipse(tw.x, tw.y - 10, 15, 25, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#4d4a45';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(tw.x - 6, tw.y - 30);
            ctx.lineTo(tw.x - 1, tw.y - 18);
            ctx.lineTo(tw.x - 5, tw.y - 8);
            ctx.moveTo(tw.x + 7, tw.y - 20);
            ctx.lineTo(tw.x + 2, tw.y - 2);
            ctx.stroke();
            ctx.restore();
        }

        function drawGame() {
            drawWorld();
            if (selected) {
                const s = st(selected);
                ctx.setLineDash([6, 6]);
                ctx.strokeStyle = 'rgba(255,240,190,.8)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(selected.x, selected.y, s.range, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            const ents = [...enemies.map(e => ({
                y: e.y,
                f: () => drawEnemy(e)
            })), ...towers.map(tw => ({
                y: tw.y,
                f: () => {
                    drawGod(tw.ty, tw.x, tw.y, tw.lvl, tw.flash, 1, buffOf(tw) > 1);
                    if (tw.stone > 0) drawStone(tw);
                }
            }))];
            ents.sort((a, b) => a.y - b.y).forEach(o => o.f());
            drawFx();
            if (placing && mouse.x > -500) {
                const ok = canPlace(mouse.x, mouse.y) && gold >= TYPES[placing].cost;
                ctx.fillStyle = ok ? 'rgba(120,255,120,.12)' : 'rgba(255,80,80,.15)';
                ctx.strokeStyle = ok ? 'rgba(120,255,120,.6)' : 'rgba(255,80,80,.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, TYPES[placing].range, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                drawGod(placing, mouse.x, mouse.y, 1, 0, 0.65);
            }
            if (casting && mouse.x > -500) {
                const P = POWERS[casting],
                    ok = onPath(mouse.x, mouse.y, 34);
                const c = casting === 'frost' ? '150,220,255' : casting === 'storm' ? '255,240,120' : '255,110,40';
                ctx.fillStyle = ok ? `rgba(${c},.18)` : 'rgba(255,60,60,.15)';
                ctx.strokeStyle = ok ? `rgba(${c},.95)` : 'rgba(255,60,60,.7)';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([8, 6]);
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, P.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.setLineDash([]);
            }
            if (flash > 0) {
                const v = view();
                ctx.fillStyle = `rgba(255,255,230,${flash*.35})`;
                ctx.fillRect(v.x, v.y, v.w, v.h);
            }
            if (banner) {
                const a = Math.min(1, banner.life),
                    v = view();
                ctx.fillStyle = `rgba(20,14,8,${.75*a})`;
                ctx.fillRect(v.x, 40, v.w, 56);
                ctx.fillStyle = `rgba(232,196,106,${a})`;
                ctx.font = 'bold 28px Georgia';
                ctx.textAlign = 'center';
                ctx.fillText(banner.txt, W / 2, 78);
            }
        }

        /* ================= DRAW: CAMPAIGN MAP ================= */
        const LAND = [
            [270, 430, 260, 150],
            [610, 330, 230, 170],
            [790, 175, 160, 120],
            [470, 225, 135, 90],
            [110, 290, 90, 60],
            [520, 520, 70, 35]
        ];
        const ISLES2 = [
            [140, 470, 100, 62],
            [310, 330, 90, 58],
            [470, 480, 82, 50],
            [610, 255, 100, 62],
            [770, 420, 92, 56],
            [830, 150, 100, 72],
            [440, 170, 42, 22],
            [650, 560, 40, 20],
            [70, 250, 42, 22],
            [560, 380, 28, 14]
        ];
        const chapterUnlocked = ch => levelUnlocked(chLevels(ch)[0]);

        function drawStar(x, y, r, filled) {
            ctx.beginPath();
            for (let i = 0; i < 10; i++) {
                const a = -Math.PI / 2 + i * Math.PI / 5,
                    rr = i % 2 ? r * .45 : r;
                ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
            }
            ctx.closePath();
            ctx.fillStyle = filled ? '#f2c94c' : 'rgba(40,30,20,.55)';
            ctx.fill();
            ctx.strokeStyle = filled ? '#8a6420' : '#bfae86';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function drawIslands(list) {
            list.forEach(([x, y, rx, ry]) => {
                ctx.fillStyle = '#d9c290';
                ctx.beginPath();
                ctx.ellipse(x, y, rx + 10, ry + 10, 0, 0, Math.PI * 2);
                ctx.fill();
            });
            list.forEach(([x, y, rx, ry]) => {
                ctx.fillStyle = '#8fa860';
                ctx.beginPath();
                ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
                ctx.fill();
            });
            list.forEach(([x, y, rx, ry]) => {
                ctx.fillStyle = '#a2b872';
                ctx.beginPath();
                ctx.ellipse(x - rx * .25, y - ry * .2, rx * .45, ry * .35, 0, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawCh1() {
            drawIslands(LAND);
            [
                [110, 440],
                [190, 500],
                [95, 500],
                [210, 430]
            ].forEach(([x, y]) => {
                ctx.fillStyle = '#6f7f4f';
                ctx.beginPath();
                ctx.arc(x, y, 9, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.strokeStyle = '#6d6250';
            ctx.lineWidth = 3;
            ctx.strokeRect(290, 330, 80, 70);
            ctx.strokeRect(302, 342, 56, 46);
            ctx.strokeRect(314, 354, 32, 22);
            [
                [430, 560, 18],
                [590, 560, 14],
                [400, 500, 10]
            ].forEach(([x, y, r]) => {
                ctx.fillStyle = '#e3cf98';
                ctx.beginPath();
                ctx.ellipse(x, y, r * 1.6, r * .8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#7aa55a';
                ctx.beginPath();
                ctx.ellipse(x, y - 2, r, r * .45, 0, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.fillStyle = '#b08a52';
            ctx.fillRect(595, 400, 110, 26);
            for (let i = 0; i < 6; i++) ctx.fillRect(595 + i * 20, 392, 11, 9);
            ctx.save();
            ctx.shadowColor = '#ff4a1f';
            ctx.shadowBlur = 24;
            ctx.fillStyle = '#1c1014';
            ctx.beginPath();
            ctx.ellipse(470, 238, 62, 34, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            ctx.fillStyle = `rgba(255,90,30,${.35+.15*Math.sin(t*2)})`;
            ctx.beginPath();
            ctx.ellipse(470, 242, 44, 20, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#8a8f97';
            ctx.beginPath();
            ctx.moveTo(680, 250);
            ctx.lineTo(790, 40);
            ctx.lineTo(900, 250);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#6f757e';
            ctx.beginPath();
            ctx.moveTo(790, 40);
            ctx.lineTo(900, 250);
            ctx.lineTo(820, 250);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(790, 40);
            ctx.lineTo(825, 107);
            ctx.lineTo(805, 98);
            ctx.lineTo(790, 112);
            ctx.lineTo(772, 96);
            ctx.lineTo(755, 107);
            ctx.closePath();
            ctx.fill();
        }

        function drawCh2() {
            drawIslands(ISLES2);
            // Πολύφημος: σπηλιά
            ctx.fillStyle = '#6d665e';
            ctx.beginPath();
            ctx.ellipse(140, 450, 56, 38, 0, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#5a534c';
            ctx.beginPath();
            ctx.ellipse(118, 440, 18, 14, 0, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#1a1512';
            ctx.beginPath();
            ctx.ellipse(140, 452, 24, 22, 0, Math.PI, 0);
            ctx.fill();
            // Κίρκη: μαγικά δέντρα
            [
                [268, 305],
                [352, 300],
                [340, 362],
                [276, 360]
            ].forEach(([x, y], i) => {
                ctx.save();
                ctx.shadowColor = '#c77dff';
                ctx.shadowBlur = 12;
                ctx.fillStyle = i % 2 ? '#7a4f9a' : '#9a6fd0';
                ctx.beginPath();
                ctx.arc(x, y, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            for (let k = 0; k < 8; k++) {
                const a = t * .8 + k * .8;
                ctx.fillStyle = `rgba(240,210,255,${.5+.5*Math.sin(t*3+k)})`;
                ctx.beginPath();
                ctx.arc(310 + Math.cos(a) * 55, 330 + Math.sin(a) * 35, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }
            // Χάρυβδη: δίνη + Σκύλλα: βράχος
            ctx.save();
            ctx.translate(385, 555);
            ctx.scale(1, .5);
            ctx.rotate(t * 1.4);
            ctx.strokeStyle = 'rgba(255,255,255,.55)';
            ctx.lineWidth = 3;
            for (let k = 0; k < 4; k++) {
                ctx.beginPath();
                ctx.arc(0, 0, 10 + k * 9, k, k + Math.PI * 1.3);
                ctx.stroke();
            }
            ctx.restore();
            ctx.fillStyle = '#4d5358';
            ctx.beginPath();
            ctx.moveTo(548, 520);
            ctx.lineTo(566, 470);
            ctx.lineTo(588, 520);
            ctx.closePath();
            ctx.fill();
            // Εσπερίδες: χρυσή μηλιά
            ctx.fillStyle = '#5b4430';
            ctx.fillRect(672, 215, 6, 30);
            ctx.fillStyle = '#4f8a3a';
            ctx.beginPath();
            ctx.arc(675, 205, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.save();
            ctx.shadowColor = '#ffd84a';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#f2c94c';
            [
                [665, 198],
                [682, 192],
                [688, 210],
                [670, 214],
                [677, 202]
            ].forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
            // Άρης: πεδίο μάχης
            ctx.fillStyle = '#9a5a3a';
            ctx.beginPath();
            ctx.ellipse(770, 425, 62, 32, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#4a3020';
            ctx.lineWidth = 3;
            [
                [716, 412, 742, 380],
                [824, 412, 798, 380],
                [810, 444, 834, 414]
            ].forEach(([a, b2, c, d]) => {
                ctx.beginPath();
                ctx.moveTo(a, b2);
                ctx.lineTo(c, d);
                ctx.stroke();
            });
            // Τάρταρος: ηφαίστειο
            ctx.fillStyle = '#2a2023';
            ctx.beginPath();
            ctx.moveTo(735, 205);
            ctx.lineTo(805, 60);
            ctx.lineTo(855, 60);
            ctx.lineTo(925, 205);
            ctx.closePath();
            ctx.fill();
            ctx.save();
            ctx.shadowColor = '#ff4a1f';
            ctx.shadowBlur = 25;
            ctx.fillStyle = `rgb(255,${90+40*Math.sin(t*2)|0},30)`;
            ctx.beginPath();
            ctx.ellipse(830, 62, 25, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            ctx.strokeStyle = '#ff6a2a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(815, 66);
            ctx.lineTo(804, 108);
            ctx.lineTo(811, 140);
            ctx.stroke();
            for (let k = 0; k < 4; k++) {
                const ph = (t * .25 + k / 4) % 1;
                ctx.fillStyle = `rgba(80,70,75,${.5*(1-ph)})`;
                ctx.beginPath();
                ctx.arc(830 + Math.sin(k * 3 + t) * 8, 52 - ph * 48, 8 + ph * 14, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawShip(x, y) {
            ctx.save();
            ctx.translate(x, y + Math.sin(t * 2) * 2);
            ctx.rotate(Math.sin(t * 1.5) * .05);
            ctx.strokeStyle = 'rgba(255,255,255,.5)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-24, 10);
            ctx.quadraticCurveTo(-32, 8, -40, 11);
            ctx.stroke();
            ctx.fillStyle = '#6b4a2a';
            ctx.beginPath();
            ctx.moveTo(-22, 0);
            ctx.lineTo(22, 0);
            ctx.lineTo(15, 9);
            ctx.lineTo(-15, 9);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#4a3020';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -30);
            ctx.stroke();
            ctx.fillStyle = '#f3efe4';
            ctx.fillRect(-12, -28, 24, 20);
            ctx.fillStyle = '#b3302a';
            ctx.fillRect(-12, -21, 24, 5);
            ctx.restore();
        }

        function drawCampaign() {
            const v = view(),
                C = CHAPTERS[chapter],
                ids = chLevels(chapter),
                open = chapterUnlocked(chapter);
            ctx.fillStyle = C.sea;
            ctx.fillRect(v.x, v.y, v.w, v.h);
            seaSpecks.forEach(([x, y, r]) => {
                ctx.strokeStyle = 'rgba(255,255,255,.14)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x, y + Math.sin(t * 1.2 + r * 6) * 2, 6, Math.PI * 1.15, Math.PI * 1.85);
                ctx.stroke();
            });
            if (chapter === 0) drawCh1();
            else drawCh2();
            // trail
            ctx.strokeStyle = chapter === 0 ? 'rgba(90,60,25,.85)' : 'rgba(255,255,255,.6)';
            ctx.lineWidth = 4;
            ctx.setLineDash([2, 10]);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ids.forEach((i, k) => {
                const [x, y] = LEVELS[i].node;
                if (!k) {
                    ctx.moveTo(x, y);
                    return;
                }
                const [px, py] = LEVELS[ids[k - 1]].node, mx = (px + x) / 2, my = (py + y) / 2, dx = x - px, dy = y - py, d = Math.hypot(dx, dy), s2 = k % 2 ? 35 : -35;
                ctx.quadraticCurveTo(mx - dy / d * s2, my + dx / d * s2, x, y);
            });
            ctx.stroke();
            ctx.setLineDash([]);
            // ship on chapter 2
            if (chapter === 1 && open) {
                const nx = ids.find(i => levelUnlocked(i) && !starsOf(i));
                const at = LEVELS[nx !== undefined ? nx : ids[ids.length - 1]].node;
                drawShip(at[0] - 62, at[1] + 14);
            }
            // nodes
            let hover = -1;
            ids.forEach(i => {
                if (Math.hypot(LEVELS[i].node[0] - mouse.x, LEVELS[i].node[1] - mouse.y) < 34) hover = i;
            });
            cv.style.cursor = hover >= 0 && levelUnlocked(hover) ? 'pointer' : 'default';
            ids.forEach((i, k) => {
                const L = LEVELS[i],
                    [x, y] = L.node,
                    un = levelUnlocked(i),
                    st2 = starsOf(i),
                    isNext = un && !st2;
                if (isNext) {
                    ctx.strokeStyle = `rgba(255,230,140,${.55+.45*Math.sin(t*4)})`;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(x, y, 34 + 2 * Math.sin(t * 4), 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.fillStyle = 'rgba(0,0,0,.3)';
                ctx.beginPath();
                ctx.ellipse(x + 3, y + 24, 24, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                const r = hover === i && un ? 29 : 26;
                ctx.fillStyle = un ? (st2 ? '#e8c46a' : '#f3e6c4') : '#7d766b';
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#5a3f18';
                ctx.lineWidth = 4;
                ctx.stroke();
                if (un) {
                    ctx.fillStyle = '#3a2810';
                    ctx.font = 'bold 22px Georgia';
                    ctx.textAlign = 'center';
                    ctx.fillText(k + 1, x, y + 8);
                } else {
                    ctx.fillStyle = '#3a342c';
                    ctx.fillRect(x - 8, y - 2, 16, 12);
                    ctx.strokeStyle = '#3a342c';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(x, y - 3, 6, Math.PI, 0);
                    ctx.stroke();
                }
                ctx.font = 'bold 14px Georgia';
                const w = ctx.measureText(L.name).width + 18;
                ctx.fillStyle = 'rgba(30,22,14,.85)';
                ctx.fillRect(x - w / 2, y + 32, w, 22);
                ctx.fillStyle = un ? '#f3e6c4' : '#a89c86';
                ctx.textAlign = 'center';
                ctx.fillText(L.name, x, y + 48);
                if (un)
                    for (let q = 0; q < 3; q++) drawStar(x - 20 + q * 20, y + 68, 8, q < st2);
            });
            if (!open) {
                ctx.fillStyle = 'rgba(10,6,3,.45)';
                ctx.fillRect(v.x, v.y, v.w, v.h);
            }
            ctx.textAlign = 'center';
            ctx.font = 'bold 28px Georgia';
            ctx.fillStyle = 'rgba(0,0,0,.45)';
            ctx.fillText(C.title, W / 2 + 2, 50);
            ctx.fillStyle = '#f3e6c4';
            ctx.fillText(C.title, W / 2, 48);
            ctx.font = '16px Georgia';
            ctx.fillStyle = open ? '#f3e6c4' : '#e8c46a';
            ctx.fillText(open ? 'Πάτα μια ανοιχτή πίστα για να παίξεις' : 'Κλειδωμένο: τελείωσε όλες τις πίστες του Κεφαλαίου ' + chapter, W / 2, 74);
        }

        function render() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = state === 'world' ? CHAPTERS[chapter].sea : theme.bg;
            ctx.fillRect(0, 0, cv.width, cv.height);
            const sh = state === 'play' && shake > 0 ? shake * 14 : 0;
            ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * (ox + (Math.random() - .5) * sh), dpr * (oy + (Math.random() - .5) * sh));
            if (state === 'world') drawCampaign();
            else drawGame();
        }

        /* ================= SCREENS / MODALS ================= */
        function msg(s) {
            $('info').textContent = s;
        }

        function modal(html, bind) {
            $('box').innerHTML = html;
            $('modal').hidden = false;
            if (bind) bind();
        }

        function closeModal() {
            $('modal').hidden = true;
        }

        function showWorld(ch) {
            if (typeof ch === 'number') chapter = ch;
            else if (state === 'play') chapter = chOf(levelIdx);
            else chapter = chapterUnlocked(1) ? 1 : 0;
            [0, 1].forEach(c => {
                const b = $('chBtn' + c);
                b.classList.toggle('sel', chapter === c);
                b.textContent = CHAPTERS[c].name + (chapterUnlocked(c) ? '' : ' (κλειδωμένο)');
            });
            state = 'world';
            closeModal();
            placing = null;
            selected = null;
            document.body.classList.add('world');
            resize();
            $('totalStars').textContent = `${totalStars()}/${LEVELS.length*3}`;
            const next = chLevels(chapter).find(i => levelUnlocked(i) && !starsOf(i));
            msg(!chapterUnlocked(chapter) ? 'Το Κεφάλαιο 2 ανοίγει όταν νικήσεις και τις 6 πίστες του Κεφαλαίου 1.' :
                next !== undefined ? `Επόμενη πίστα: ${lvlNum(next)} ${LEVELS[next].name}` : 'Κατέκτησες όλο το κεφάλαιο! Κυνήγα τα 3 αστέρια στο Θρυλικό.');
        }

        function startLevel(i) {
            loadMap(i);
            state = 'play';
            closeModal();
            document.body.classList.remove('world');
            resize();
            $('lvlName').textContent = `${lvlNum(i)} ${LEVELS[i].name}`;
            newGame();
        }

        function openLevel(i) {
            const L = LEVELS[i],
                s = starsOf(i);
            modal(`<h2>Πίστα ${lvlNum(i)}: ${L.name}</h2><p>${L.desc}</p>
    <p class="gold">${L.waves} κύματα · ${L.ch===1?'ο Κέρβερος':'η Λερναία Ύδρα'} στο τέλος</p>
    <p>Καλύτερο: <span class="gold">${starStr(s)}</span>${save.diff[i]?' · '+DIFFS[save.diff[i]].name:''}</p>
    <p style="font-size:13px;opacity:.85">3 αστέρια: καμία χαμένη ζωή · 2 αστέρια: τουλάχιστον οι μισές ζωές</p>
    <div class="row" id="dsel"></div>
    <div class="row"><button id="mBack">Πίσω</button><button class="primary" id="mPlay">Παίξε</button></div>`, () => {
                const draw = () => {
                    $('dsel').innerHTML = '';
                    DORDER.forEach(k => {
                        const b = document.createElement('button');
                        b.className = 'diff' + (k === diffKey ? ' sel' : '');
                        b.innerHTML = `${DIFFS[k].name}<small>${DIFFS[k].d}</small>`;
                        b.onclick = () => {
                            diffKey = k;
                            draw();
                        };
                        $('dsel').appendChild(b);
                    });
                };
                draw();
                $('mBack').onclick = closeModal;
                $('mPlay').onclick = () => startLevel(i);
            });
        }

        function onWin() {
            const i = levelIdx,
                stars = lives >= maxLives ? 3 : lives >= maxLives / 2 ? 2 : 1;
            const before = levelsCleared(),
                prev = starsOf(i);
            const record = stars > prev || (stars === prev && DORDER.indexOf(diffKey) > DORDER.indexOf(save.diff[i] || 'easy'));
            if (stars > prev) save.stars[i] = stars;
            if (!save.diff[i] || DORDER.indexOf(diffKey) > DORDER.indexOf(save.diff[i])) save.diff[i] = diffKey;
            persist();
            const after = levelsCleared();
            const newGods = ORDER.filter(ty => TYPES[ty].unlock > before && TYPES[ty].unlock <= after);
            const newPowers = PORDER.filter(k => POWERS[k].unlock > before && POWERS[k].unlock <= after);
            const hasNext = i + 1 < LEVELS.length;
            const final = !hasNext,
                chEnd = hasNext && chOf(i + 1) !== chOf(i);
            modal(`<h2>${final?'ΚΑΤΕΚΤΗΣΕΣ ΟΛΟ ΤΟΝ ΚΟΣΜΟ!':chEnd?'ΚΑΤΕΚΤΗΣΕΣ ΤΟΝ ΟΛΥΜΠΟ!':'ΝΙΚΗ!'}</h2>
    <div class="stars">${starStr(stars)}</div>
    <p>${LEVELS[i].name} · ${DIFFS[diffKey].name} · Ζωές ${lives}/${maxLives}</p>
    ${record?'<p style="color:#9fe07a">Νέο ρεκόρ!</p>':''}
    ${stars<3?'<p style="font-size:13px;opacity:.85">Για 3 αστέρια τελείωσε την πίστα χωρίς να χάσεις ζωή.</p>':''}
    ${chEnd && prev===0?`<p class="gold" style="font-size:17px">Ξεκλείδωσες το ΚΕΦΑΛΑΙΟ 2: Η Οδύσσεια!<br><small>Νέος χάρτης με 6 πίστες, Κένταυροι, Μέδουσες και ο Κέρβερος.</small></p>`:hasNext && prev===0?`<p class="gold">Ξεκλείδωσες την πίστα ${lvlNum(i+1)}: ${LEVELS[i+1].name}!</p>`:''}
    <div id="unl"></div>
    <div class="row"><button id="mMap">Χάρτης</button><button id="mRetry">Ξανά</button>${hasNext?`<button class="primary" id="mNext">${chEnd?'Στο Κεφάλαιο 2':'Επόμενη πίστα'}</button>`:''}</div>`, ()=>{
    newGods.forEach(ty=>{ const d=document.createElement('div'); d.className='unlock'; d.appendChild(godIcon(ty));
      const sp=document.createElement('span'); sp.innerHTML=`<b class="gold">Νέο σχέδιο: ${TYPES[ty].name}</b><br><small>${TYPES[ty].desc}</small>`; d.appendChild(sp); $('unl').appendChild(d); });
    newPowers.forEach(k=>{ const d=document.createElement('div'); d.className='unlock'; d.appendChild(powerIcon(k));
      const sp=document.createElement('span'); sp.innerHTML=`<b style="color:#d6b8ff">Νέα δύναμη: ${POWERS[k].name}</b><br><small>${POWERS[k].desc}</small>`; d.appendChild(sp); $('unl').appendChild(d); });
    $('mMap').onclick=showWorld; $('mRetry').onclick=()=>startLevel(i);
    if(hasNext) $('mNext').onclick=()=>{ if(chEnd){ showWorld(chOf(i+1)); } else { closeModal(); openLevel(i+1); } };
  });
}
function onLose(){
  modal(`<h2>Ο Όλυμπος έπεσε!</h2><p>Άντεξες μέχρι το κύμα ${wave}/${LEVELS[levelIdx].waves}.</p>
    <p style="font-size:13px;opacity:.85">Συμβουλή: βάλε τον Ποσειδώνα σε στροφές για να επιβραδύνει τα τέρατα, και τον Δία κοντά σε σημεία που μαζεύονται πολλά μαζί.</p>
    <div class="row"><button id="mMap">Χάρτης</button><button class="primary" id="mRetry">Ξανά</button></div>`, ()=>{
    $('mMap').onclick=showWorld; $('mRetry').onclick=()=>startLevel(levelIdx);
  });
}
function openPause(){
  if(state!=='play' || over || won) return;
  modal(`<h2>Παύση</h2><p>${LEVELS[levelIdx].name} · ${DIFFS[diffKey].name}</p>
    <div class="row"><button id="mMap">Χάρτης</button><button id="mRestart">Επανεκκίνηση</button><button class="primary" id="mGo">Συνέχεια</button></div>`, ()=>{
    $('mMap').onclick=showWorld; $('mRestart').onclick=()=>startLevel(levelIdx); $('mGo').onclick=closeModal;
  });
}

/* ================= HUD ================= */
function buildButtons(){
  const box=$('towerBtns'); box.innerHTML='';
  ORDER.forEach((ty,i)=>{
    const T=TYPES[ty], b=document.createElement('button'); b.className='tb'; b.dataset.t=ty;
    b.appendChild(godIcon(ty));
    const sp=document.createElement('span');
    if(unlocked(ty)){ sp.innerHTML=`${T.name}<small>${T.cost} χρυσός</small>`; b.onclick=()=>setPlacing(ty); b.title=`${T.desc} (πλήκτρο ${i+1})`; }
    else { b.classList.add('locked'); sp.innerHTML=`${T.name}<small>Κλειδωμένο</small>`;
      b.onclick=()=>msg(`Σχέδιο «${T.name}»: ξεκλειδώνει όταν νικήσεις την πίστα ${lvlNum(T.unlock-1)} (${LEVELS[T.unlock-1].name}).`); }
    b.appendChild(sp); box.appendChild(b);
  });
  const pb=$('powerBtns'); pb.innerHTML='';
  PORDER.forEach(k=>{
    const P=POWERS[k], b=document.createElement('button'); b.className='tb pb'; b.dataset.p=k;
    b.appendChild(powerIcon(k));
    const sp=document.createElement('span');
    if(availP[k]){ sp.innerHTML=`${P.name}<small>Έτοιμο · ${P.key}</small>`; b.onclick=()=>setCasting(k); b.title=`${P.desc} (πλήκτρο ${P.key})`; }
    else { b.classList.add('locked'); sp.innerHTML=`${P.name}<small>Κλειδωμένο</small>`;
      b.onclick=()=>msg(`Δύναμη «${P.name}»: ξεκλειδώνει όταν νικήσεις την πίστα ${lvlNum(P.unlock-1)} (${LEVELS[P.unlock-1].name}).`); }
    b.appendChild(sp); pb.appendChild(b);
  });
}
function hud(){
  if(state!=='play') return;
  $('gold').textContent=gold; $('lives').textContent=lives; $('wave').textContent=`${wave}/${LEVELS[levelIdx].waves}`;
  document.querySelectorAll('#towerBtns .tb').forEach(b=>{
    if(b.classList.contains('locked')) return;
    b.disabled=gold<TYPES[b.dataset.t].cost; b.classList.toggle('sel',placing===b.dataset.t);
  });
  document.querySelectorAll('#powerBtns .pb').forEach(b=>{
    if(b.classList.contains('locked')) return;
    const k=b.dataset.p, c=pcd[k]||0, pct=c/POWERS[k].cd*100;
    b.disabled=c>0||over||won; b.classList.toggle('sel',casting===k);
    b.style.background = c>0 ? `linear-gradient(to top, #1a1420 ${pct}%, #3a2650 ${pct}%)` : '';
    b.querySelector('small').textContent = c>0 ? `${Math.ceil(c)}s` : `Έτοιμο · ${POWERS[k].key}`;
  });
  $('start').disabled=waveActive||over||won;
  $('up').hidden=$('sell').hidden=!selected;
  if(selected){
    $('up').textContent = selected.lvl>=3 ? 'Μέγιστο επίπεδο' : `Αναβάθμιση · ${upCost(selected)}`;
    $('up').disabled = selected.lvl>=3 || gold<upCost(selected);
    $('sell').textContent = `Πώληση · +${Math.round(selected.spent*0.6)}`;
  }
}
function setPlacing(ty){
  if(!unlocked(ty)) return;
  placing = placing===ty ? null : ty; selected=null; casting=null;
  if(placing) msg(`${TYPES[placing].name}: ${TYPES[placing].desc}. Πάτα στον χάρτη για να τον βάλεις (Esc ή δεξί κλικ για ακύρωση).`);
}
function setCasting(k){
  if(!availP[k] || pcd[k]>0 || over || won) return;
  casting = casting===k ? null : k; placing=null; selected=null;
  if(casting) msg(`${POWERS[k].name}: πάτα πάνω στον δρόμο για να τη ρίξεις (Esc για ακύρωση).`);
}
function pos(ev){ const r=cv.getBoundingClientRect(); return {x:(ev.clientX-r.left-ox)/sc, y:(ev.clientY-r.top-oy)/sc}; }

$('start').onclick=startWave;
$('speed').onclick=()=>{ speed=speed===1?2:speed===2?3:1; $('speed').textContent=`x${speed}`; };
$('pause').onclick=openPause;
$('fs').onclick=async()=>{
  try{
    if(!document.fullscreenElement){ await document.documentElement.requestFullscreen(); try{ await screen.orientation.lock('landscape'); }catch(e){} }
    else await document.exitFullscreen();
  }catch(e){ msg('Αυτός ο browser δεν επιτρέπει πλήρη οθόνη. Στο iPhone: Κοινοποίηση → «Προσθήκη στην οθόνη αφετηρίας».'); }
};
$('chBtn0').onclick=()=>showWorld(0);
$('chBtn1').onclick=()=>showWorld(1);
$('resetSave').onclick=()=>modal(`<h2>Νέα εκστρατεία;</h2><p>Θα σβηστούν όλα τα αστέρια και η πρόοδός σου.</p>
  <div class="row"><button id="mNo">Άκυρο</button><button class="primary" id="mYes">Ναι, από την αρχή</button></div>`, ()=>{
  $('mNo').onclick=closeModal; $('mYes').onclick=()=>{ save={stars:{},diff:{}}; persist(); showWorld(); };
});
$('up').onclick=()=>{ const s=selected; if(s && s.lvl<3 && gold>=upCost(s)){ const c=upCost(s); gold-=c; s.spent+=c; s.lvl++; msg(`${TYPES[s.ty].name} ανέβηκε στο επίπεδο ${s.lvl}!`); } };
$('sell').onclick=()=>{ if(!selected) return; gold+=Math.round(selected.spent*0.6); towers=towers.filter(o=>o!==selected); selected=null; };

cv.addEventListener('pointermove',ev=>{ if(ev.pointerType==='mouse') mouse=pos(ev); });
cv.addEventListener('mouseleave',()=>mouse={x:-999,y:-999});
cv.addEventListener('contextmenu',ev=>{ ev.preventDefault(); placing=null; casting=null; });
cv.addEventListener('click',ev=>{
  const p=pos(ev); mouse=p;
  if(!$('modal').hidden) return;
  if(state==='world'){
    const i=chLevels(chapter).find(j=>Math.hypot(LEVELS[j].node[0]-p.x,LEVELS[j].node[1]-p.y)<36);
    if(i!==undefined){ if(levelUnlocked(i)) openLevel(i); else msg(`Η πίστα «${LEVELS[i].name}» είναι κλειδωμένη: νίκησε πρώτα την «${LEVELS[i-1].name}».`); }
    return;
  }
  if(over||won) return;
  if(casting){
    if(onPath(p.x,p.y,34)) cast(casting,p.x,p.y); else msg('Οι δυνάμεις πέφτουν μόνο πάνω στον δρόμο των τεράτων.');
    return;
  }
  if(placing){
    const T=TYPES[placing];
    if(!canPlace(p.x,p.y)) msg('Δεν μπορείς να χτίσεις εκεί.');
    else if(gold<T.cost) msg('Δεν έχεις αρκετό χρυσό.');
    else { gold-=T.cost; towers.push({ty:placing,x:p.x,y:p.y,lvl:1,cd:0,spent:T.cost}); if(gold<T.cost) placing=null; }
    return;
  }
  selected=towers.find(o=>Math.hypot(o.x-p.x,o.y-p.y)<28)||null;
  if(selected) msg(`${TYPES[selected.ty].name} (επίπεδο ${selected.lvl}): ${TYPES[selected.ty].desc}`);
});
addEventListener('keydown',ev=>{
  if(state!=='play') return;
  if(!$('modal').hidden){ if(ev.key==='Escape' && !over && !won) closeModal(); return; }
  const n=parseInt(ev.key); if(n>=1 && n<=ORDER.length) setPlacing(ORDER[n-1]);
  const pk=PORDER.find(k=>POWERS[k].key===ev.key.toUpperCase()); if(pk) setCasting(pk);
  if(ev.key==='Escape'){ if(placing||selected||casting){ placing=null; selected=null; casting=null; } else openPause(); }
  if(ev.key==='p'||ev.key==='P') openPause();
  if(ev.code==='Space'){ ev.preventDefault(); startWave(); }
});

/* ================= BOOT ================= */
loadMap(0); showWorld();
if(innerHeight>innerWidth && innerWidth<700) msg('Συμβουλή: γύρισε το κινητό οριζόντια για μεγαλύτερο χάρτη.');
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='play' && !over && !won && $('modal').hidden){ for(let i=0;i<speed;i++){ update(dt); if(over||won) break; } } else t+=dt;
  render(); hud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
    </script>
</body>

</html>
